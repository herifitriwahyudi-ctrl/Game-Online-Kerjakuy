<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍎 Fruit Crush Bet 🍊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            padding: 10px;
        }

        .game-container {
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.6), 0 0 0 3px rgba(255, 215, 0, 0.3);
            max-width: 720px;
            width: 100%;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            color: #333;
            font-size: 1.7em;
            margin-bottom: 2px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #888;
            font-size: 0.75em;
        }

        /* ===== TOP ROW ===== */
        .top-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        .saldo-box {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 12px;
            padding: 8px 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4), inset 0 0 15px rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .saldo-label {
            font-size: 0.6em;
            color: #4a2800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .saldo-value {
            font-size: 1.2em;
            font-weight: 900;
            color: #333;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        .action-btn {
            border: none;
            border-radius: 12px;
            padding: 8px 5px;
            font-size: 0.75em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            letter-spacing: 0.5px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        .action-btn .icon {
            font-size: 1.3em;
        }

        .action-btn .label {
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .btn-topup {
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #e17055 0%, #c0392b 100%);
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            border-radius: 15px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.1);
            cursor: pointer;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        /* ===== BET PANEL ===== */
        .bet-panel {
            margin-top: 10px;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            border-radius: 15px;
            padding: 10px 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4), inset 0 0 20px rgba(0, 200, 255, 0.1);
            border: 2px solid rgba(0, 200, 255, 0.3);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: white;
        }

        .bet-title {
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #00D4FF;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
            letter-spacing: 1px;
        }

        .bet-controls-top {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bet-control-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.7em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bet-control-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            border-color: #00D4FF;
        }

        .bet-main {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bet-display {
            flex: 1;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d4a 100%);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .bet-display-label {
            font-size: 0.6em;
            color: #00D4FF;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.9;
        }

        .bet-display-value {
            font-size: 1.4em;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .bet-arrow {
            background: linear-gradient(135deg, #00D4FF 0%, #0099CC 100%);
            color: white;
            border: none;
            border-radius: 12px;
            width: 46px;
            height: 46px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .bet-arrow:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.7);
        }

        .bet-arrow:active:not(:disabled) {
            transform: translateY(-1px) scale(0.98);
        }

        .bet-arrow:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: linear-gradient(135deg, #666 0%, #444 100%);
        }

        .bet-arrow.down {
            background: linear-gradient(135deg, #f5576c 0%, #c72c41 100%);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .bet-arrow.down:hover:not(:disabled) {
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.7);
        }

        .bet-quick {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin-top: 8px;
        }

        .bet-quick-btn {
            background: linear-gradient(135deg, #2d2d4a 0%, #1a1a2e 100%);
            color: #00D4FF;
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 8px;
            padding: 6px 2px;
            font-size: 0.7em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bet-quick-btn:hover {
            background: linear-gradient(135deg, #00D4FF 0%, #0099CC 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.5);
        }

        .bet-quick-btn.active {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #333;
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            transform: scale(1.05);
        }

        /* ===== AUTO SPIN PANEL ===== */
        .autospin-panel {
            margin-top: 8px;
            background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .autospin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: white;
        }

        .autospin-title {
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .autospin-status {
            font-size: 0.7em;
            background: rgba(255,255,255,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .autospin-status.active {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #333;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(132, 250, 176, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(132, 250, 176, 0); }
        }

        .autospin-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .spin-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: 2px solid transparent;
            padding: 6px 3px;
            font-size: 0.75em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            position: relative;
            overflow: hidden;
        }

        .spin-btn .spin-count {
            font-size: 0.95em;
        }

        .spin-btn .spin-label {
            font-size: 0.5em;
            opacity: 0.9;
            text-transform: uppercase;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spin-btn.selected {
            border-color: #FFD700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.5);
        }

        .spin-btn.spinning {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            animation: spinPulse 0.8s infinite;
        }

        @keyframes spinPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
        }

        .spin-btn .spin-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #FFD700;
            width: 0%;
            transition: width 0.3s;
        }

        .spin-btn.unlimited {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #333;
        }

        .autospin-controls {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .autospin-controls button {
            flex: 1;
            padding: 8px;
            font-size: 0.8em;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-stop {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #333;
        }

        .btn-stop:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== BONUS PANEL ===== */
        .bonus-panel {
            margin-top: 8px;
            background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #4a0080 100%);
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4), inset 0 0 30px rgba(255, 0, 255, 0.1);
            border: 2px solid rgba(255, 100, 255, 0.3);
        }

        .bonus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: white;
        }

        .bonus-title {
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #FF66FF;
            text-shadow: 0 0 10px rgba(255, 102, 255, 0.7);
            letter-spacing: 1px;
        }

        .bonus-status {
            font-size: 0.7em;
            background: rgba(255,255,255,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .bonus-status.active {
            background: linear-gradient(135deg, #FF66FF 0%, #FF00AA 100%);
            color: white;
            animation: bonusPulse 1.2s infinite;
        }

        @keyframes bonusPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 102, 255, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(255, 102, 255, 0); }
        }

        .bonus-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .bonus-btn {
            background: linear-gradient(135deg, #4a0080 0%, #7a00c0 100%);
            color: white;
            border: 2px solid rgba(255, 102, 255, 0.4);
            padding: 8px 4px;
            font-size: 0.72em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .bonus-btn .bonus-mult {
            font-size: 1.1em;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }

        .bonus-btn .bonus-label {
            font-size: 0.55em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bonus-btn .bonus-cost {
            font-size: 0.65em;
            color: #FFD700;
            font-weight: bold;
        }

        .bonus-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            border-color: #FF66FF;
            box-shadow: 0 8px 20px rgba(255, 102, 255, 0.5);
        }

        .bonus-btn.active {
            border-color: #FFD700;
            background: linear-gradient(135deg, #FF00AA 0%, #FF66FF 100%);
            animation: activeBonus 1s infinite;
        }

        @keyframes activeBonus {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.8); }
            50% { box-shadow: 0 0 0 12px rgba(255, 215, 0, 0); }
        }

        .bonus-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 25px;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            padding: 30px;
            text-align: center;
            color: white;
        }

        .overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .overlay h2 {
            font-size: 2em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f093fb 0%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay .big-score {
            font-size: 2.5em;
            font-weight: bold;
            color: #FFD700;
            margin: 12px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .overlay button {
            margin-top: 15px;
            padding: 12px 35px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }

        .combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 2.8em;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 100, 0, 0.6);
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            white-space: nowrap;
        }

        .combo-display.pop {
            animation: comboPop 1s ease-out;
        }

        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 25px 70px rgba(0,0,0,0.8), 0 0 0 3px rgba(255, 215, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.4);
            color: white;
            text-align: center;
        }

        .modal-content h3 {
            font-size: 1.4em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .modal-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .modal-option {
            background: linear-gradient(135deg, #2d2d4a 0%, #1a1a2e 100%);
            color: white;
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 10px;
            padding: 12px 5px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-option:hover {
            background: linear-gradient(135deg, #00D4FF 0%, #0099CC 100%);
            border-color: #00D4FF;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.5);
        }

        .modal-option.topup-option:hover {
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
            border-color: #00b894;
            box-shadow: 0 8px 20px rgba(0, 184, 148, 0.5);
        }

        .modal-option.withdraw-option:hover {
            background: linear-gradient(135deg, #e17055 0%, #c0392b 100%);
            border-color: #e17055;
            box-shadow: 0 8px 20px rgba(225, 112, 85, 0.5);
        }

        .modal-option .amount {
            font-size: 1.1em;
            color: #FFD700;
            display: block;
            margin-bottom: 2px;
        }

        .modal-option .bonus-tag {
            font-size: 0.6em;
            color: #84fab0;
            display: block;
        }

        .modal-input {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 10px;
            padding: 10px;
            color: white;
            font-size: 1em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
        }

        .modal-input:focus {
            border-color: #00D4FF;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn-cancel {
            background: linear-gradient(135deg, #666 0%, #444 100%);
            color: white;
        }

        .modal-btn-cancel:hover {
            transform: translateY(-2px);
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #333;
        }

        .modal-btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.5);
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.3em; }
            .saldo-value { font-size: 1em; }
            .action-btn { font-size: 0.65em; padding: 6px 3px; }
            .action-btn .icon { font-size: 1.1em; }
            .bonus-options { gap: 3px; }
            .bonus-btn { padding: 6px 2px; font-size: 0.65em; }
            .bonus-btn .bonus-mult { font-size: 0.95em; }
            .spin-btn { font-size: 0.65em; padding: 5px 2px; }
            .combo-display { font-size: 1.8em; }
            .bet-display-value { font-size: 1.1em; }
            .bet-arrow { width: 40px; height: 40px; font-size: 1.3em; }
            .bet-quick-btn { font-size: 0.6em; padding: 5px 1px; }
            .modal-options { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🍎 Fruit Crush Bet 🍊</h1>
            <div class="subtitle">Match 3 • Bonus Crush • Bet System</div>
        </div>

        <!-- ===== TOP ROW ===== -->
        <div class="top-row">
            <div class="saldo-box">

                <button class="modal-option withdraw-option" onclick="doWithdraw(50000)">
                    <span class="amount">50,000</span>
                </button>
                <button class="modal-option withdraw-option" onclick="doWithdraw(100000)">

                </button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const ROWS = 8;
        const COLS = 8;
        const TILE_SIZE = canvas.width / COLS;

        const FRUIT_TYPES = [
            { emoji: '🍎', color: '#ff4444', name: 'Apel' },
            { emoji: '🍊', color: '#ff8800', name: 'Jeruk' },
            { emoji: '🍇', color: '#9944ff', name: 'Anggur' },
            { emoji: '🍋', color: '#ffdd00', name: 'Lemon' },
            { emoji: '🍓', color: '#ff2266', name: 'Strawberry' },
            { emoji: '🥝', color: '#88cc00', name: 'Kiwi' }
        ];

        const BET_LEVELS = [100, 500, 1000, 2000, 5000, 10000];

        const BONUS_CONFIG = [
            { mult: 50,   baseCost: 10000 },
            { mult: 100,  baseCost: 10000 },
            { mult: 200,  baseCost: 10000 },
            { mult: 300,  baseCost: 10000 },
            { mult: 500,  baseCost: 10000 },
            { mult: 1000, baseCost: 10000 }
        ];

        let bet = {
            current: 100,
            index: 0,
            min: 100,
            max: 10000
        };

        let game = {
            board: [],
            score: 0,
            balance: 10000,
            selected: null,
            isAnimating: false,
            combo: 0,
            particles: [],
            floatingTexts: [],
            hintTile: null,
            hintTimer: 0,
            gameOver: false
        };

        let bonus = {
            active: false,
            multiplier: 0,
            spinsLeft: 0,
            totalSpins: 0
        };

        let autoSpin = {
            active: false,
            selected: 0,
            remaining: 0,
            total: 0,
            spinCount: 0,
            isUnlimited: false,
            timeoutId: null,
            delayMs: 350
        };

        // ===== BONUS PRICING =====
        function getBonusCost(baseCost) {
            return baseCost * (bet.current / 100);
        }

        function renderBonusButtons() {
            const container = document.getElementById('bonusOptions');
            container.innerHTML = '';
            BONUS_CONFIG.forEach(cfg => {
                const cost = getBonusCost(cfg.baseCost);
                const btn = document.createElement('button');
                btn.className = 'bonus-btn';
                btn.dataset.mult = cfg.mult;
                btn.onclick = () => buyBonus(cfg.mult, cost);
                btn.innerHTML = `
                    <span class="bonus-mult">${cfg.mult}x</span>
                    <span class="bonus-label">Crush</span>
                    <span class="bonus-cost">💰 ${cost.toLocaleString('id-ID')}</span>
                `;
                if (bonus.active && bonus.multiplier === cfg.mult) {
                    btn.classList.add('active');
                }
                container.appendChild(btn);
            });
        }

        // ===== TOPUP / WITHDRAW =====
        function openTopup() {
            if (game.isAnimating || autoSpin.active) return;
            document.getElementById('topupModal').classList.add('show');
        }

        function openWithdraw() {
            if (game.isAnimating || autoSpin.active) return;
            document.getElementById('withdrawModal').classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function doTopup(amount) {
            let bonusPct = 0;
            if (amount === 25000) bonusPct = 0.05;
            else if (amount === 50000) bonusPct = 0.10;
            else if (amount === 100000) bonusPct = 0.15;
            else if (amount === 500000) bonusPct = 0.25;

            const bonusAmount = Math.floor(amount * bonusPct);
            const total = amount + bonusAmount;

            addBalance(total);
            closeModal('topupModal');
            createFloatingText(canvas.width / 2, canvas.height / 2, `📥 +${total.toLocaleString('id-ID')}`, '#00b894', 32);
            if (bonusAmount > 0) {
                createFloatingText(canvas.width / 2, canvas.height / 2 + 40, `🎁 Bonus +${bonusAmount.toLocaleString('id-ID')}`, '#FFD700', 24);
            }
        }

        function doTopupCustom() {
            const val = parseInt(document.getElementById('topupCustom').value);
            if (!val || val < 1000) {
                alert('Minimal top up 1,000');
                return;
            }
            doTopup(val);
            document.getElementById('topupCustom').value = '';
        }

        function doWithdraw(amount) {
            if (amount > game.balance) {
                alert('Saldo tidak cukup!');
                return;
            }
            deductBalance(amount);
            closeModal('withdrawModal');
            createFloatingText(canvas.width / 2, canvas.height / 2, `📤 -${amount.toLocaleString('id-ID')}`, '#e17055', 32);
        }

        function doWithdrawAll() {
            if (game.balance <= 0) {
                alert('Saldo kosong!');
                return;
            }
            doWithdraw(game.balance);
        }

        function doWithdrawCustom() {
            const val = parseInt(document.getElementById('withdrawCustom').value);
            if (!val || val < 1000) {
                alert('Minimal tarik 1,000');
                return;
            }
            doWithdraw(val);
            document.getElementById('withdrawCustom').value = '';
        }

        // ===== BET FUNCTIONS =====
        function updateBetUI() {
            document.getElementById('betDisplay').textContent = bet.current.toLocaleString('id-ID');
            document.getElementById('betDown').disabled = bet.index === 0;
            document.getElementById('betUp').disabled = bet.index === BET_LEVELS.length - 1;

            document.querySelectorAll('.bet-quick-btn').forEach(b => {
                b.classList.toggle('active', parseInt(b.dataset.bet) === bet.current);
            });

            renderBonusButtons();
        }

        function increaseBet() {
            if (game.isAnimating || autoSpin.active) return;
            if (bet.index < BET_LEVELS.length - 1) {
                bet.index++;
                bet.current = BET_LEVELS[bet.index];
                updateBetUI();
                createFloatingText(canvas.width / 2, canvas.height - 20, `💰 Bet: ${bet.current}`, '#00D4FF', 24);
            }
        }

        function decreaseBet() {
            if (game.isAnimating || autoSpin.active) return;
            if (bet.index > 0) {
                bet.index--;
                bet.current = BET_LEVELS[bet.index];
                updateBetUI();
                createFloatingText(canvas.width / 2, canvas.height - 20, `💰 Bet: ${bet.current}`, '#F5576C', 24);
            }
        }

        function setBet(amount) {
            if (game.isAnimating || autoSpin.active) return;
            const idx = BET_LEVELS.indexOf(amount);
            if (idx >= 0) {
                bet.index = idx;
                bet.current = amount;
                updateBetUI();
                createFloatingText(canvas.width / 2, canvas.height - 20, `💰 Bet: ${amount}`, '#FFD700', 24);
            }
        }

        function setBetMin() {
            if (game.isAnimating || autoSpin.active) return;
            setBet(BET_LEVELS[0]);
        }

        function setBetMax() {
            if (game.isAnimating || autoSpin.active) return;
            setBet(BET_LEVELS[BET_LEVELS.length - 1]);
        }

        // ===== BALANCE =====
        function deductBalance(amount) {
            game.balance -= amount;
            if (game.balance < 0) game.balance = 0;
            updateBalanceUI();
        }

        function addBalance(amount) {
            game.balance += amount;
            updateBalanceUI();
        }

        function updateBalanceUI() {
            document.getElementById('balance').textContent = game.balance.toLocaleString('id-ID');
        }

        // ===== INIT BOARD =====
        function initBoard() {
            game.board = [];
            for (let r = 0; r < ROWS; r++) {
                game.board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    let type;
                    let attempts = 0;
                    do {
                        type = Math.floor(Math.random() * FRUIT_TYPES.length);
                        attempts++;
                    } while (wouldMatch(r, c, type) && attempts < 50);
                    game.board[r][c] = type;
                }
            }
            if (!findHint()) autoShuffleIfStuck();
        }

        function wouldMatch(row, col, type) {
            if (col >= 2) {
                if (game.board[row][col-1] === type && game.board[row][col-2] === type) return true;
            }
            if (row >= 2) {
                if (game.board[row-1][col] === type && game.board[row-2][col] === type) return true;
            }
            return false;
        }

        // ===== DRAWING =====
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;
                    ctx.fillStyle = (r + c) % 2 === 0 ? '#fff5e6' : '#ffe8cc';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                }
            }

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const type = game.board[r][c];
                    if (type === null || type === undefined) continue;

                    const x = c * TILE_SIZE + TILE_SIZE / 2;
                    const y = r * TILE_SIZE + TILE_SIZE / 2;

                    if (game.selected && game.selected.r === r && game.selected.c === c) {
                        ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
                        ctx.beginPath();
                        ctx.arc(x, y, TILE_SIZE * 0.48, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#FFD700';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }

                    if (game.hintTile && game.hintTile.r === r && game.hintTile.c === c) {
                        const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
                        ctx.fillStyle = `rgba(132, 250, 176, ${pulse * 0.5})`;
                        ctx.beginPath();
                        ctx.arc(x, y, TILE_SIZE * 0.45, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.save();
                    ctx.font = `${TILE_SIZE * 0.7}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,0.15)';
                    ctx.shadowBlur = 5;
                    ctx.shadowOffsetY = 2;
                    ctx.fillText(FRUIT_TYPES[type].emoji, x, y);
                    ctx.restore();
                }
            }

            game.particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            game.floatingTexts.forEach(t => {
                ctx.globalAlpha = t.life;
                ctx.fillStyle = t.color;
                ctx.font = `bold ${t.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.strokeText(t.text, t.x, t.y);
                ctx.fillText(t.text, t.x, t.y);
                ctx.globalAlpha = 1;
            });

            if (autoSpin.active) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
                ctx.lineWidth = 4;
                ctx.setLineDash([15, 10]);
                ctx.lineDashOffset = -Date.now() / 30;
                ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
                ctx.restore();
            }

            if (bonus.active) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 102, 255, 0.8)';
                ctx.lineWidth = 5;
                ctx.setLineDash([20, 8]);
                ctx.lineDashOffset = Date.now() / 25;
                ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);
                ctx.restore();

                ctx.save();
                ctx.font = `bold ${TILE_SIZE * 1.2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = `rgba(255, 102, 255, ${0.15 + Math.sin(Date.now()/150) * 0.1})`;
                ctx.fillText(`${bonus.multiplier}x`, canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }

            // Bet indicator
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(5, 5, 130, 22);
            ctx.fillStyle = '#00D4FF';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(`💰 BET: ${bet.current.toLocaleString('id-ID')}`, 10, 16);
            ctx.restore();
        }

        // ===== MATCH DETECTION =====
        function findMatches() {
            const matches = new Set();

            for (let r = 0; r < ROWS; r++) {
                let count = 1;
                for (let c = 1; c <= COLS; c++) {
                    if (c < COLS && game.board[r][c] !== null && game.board[r][c] === game.board[r][c-1]) {
                        count++;
                    } else {
                        if (count >= 3 && game.board[r][c-1] !== null) {
                            for (let k = c - count; k < c; k++) matches.add(`${r},${k}`);
                        }
                        count = 1;
                    }
                }
            }

            for (let c = 0; c < COLS; c++) {
                let count = 1;
                for (let r = 1; r <= ROWS; r++) {
                    if (r < ROWS && game.board[r][c] !== null && game.board[r][c] === game.board[r-1][c]) {
                        count++;
                    } else {
                        if (count >= 3 && game.board[r-1][c] !== null) {
                            for (let k = r - count; k < r; k++) matches.add(`${k},${c}`);
                        }
                        count = 1;
                    }
                }
            }

            return matches;
        }

        // ===== SWAP =====
        function swapTiles(r1, c1, r2, c2) {
            const temp = game.board[r1][c1];
            game.board[r1][c1] = game.board[r2][c2];
            game.board[r2][c2] = temp;
        }

        function isValidSwap(r1, c1, r2, c2) {
            swapTiles(r1, c1, r2, c2);
            const matches = findMatches();
            swapTiles(r1, c1, r2, c2);
            return matches.size > 0;
        }

        // ===== AUTO SHUFFLE =====
        function autoShuffleIfStuck() {
            // Auto-shuffle tanpa tombol
            const allFruits = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (game.board[r][c] !== null) allFruits.push(game.board[r][c]);
                }
            }

            for (let i = allFruits.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allFruits[i], allFruits[j]] = [allFruits[j], allFruits[i]];
            }

            let idx = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (game.board[r][c] !== null) game.board[r][c] = allFruits[idx++];
                }
            }

            let attempts = 0;
            while ((findMatches().size > 0 || !findHint()) && attempts < 100) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (game.board[r][c] !== null) {
                            game.board[r][c] = Math.floor(Math.random() * FRUIT_TYPES.length);
                        }
                    }
                }
                attempts++;
            }

            game.selected = null;
            game.hintTile = null;
        }

        // ===== CASCADE =====
        async function processMatches(isInitial = false) {
            let totalCascade = 0;
            let totalWon = 0;

            while (true) {
                const matches = findMatches();
                if (matches.size === 0) break;

                totalCascade++;
                const matchCount = matches.size;

                const baseScore = 10;
                const sizeBonus = matchCount > 3 ? (matchCount - 3) * 10 : 0;
                const cascadeMultiplier = 1 + (totalCascade - 1) * 0.5;
                const bonusMultiplier = bonus.active ? bonus.multiplier : 1;

                const basePoints = Math.floor(
                    (baseScore * matchCount + sizeBonus) * 
                    cascadeMultiplier * 
                    bonusMultiplier
                );

                const betMultiplier = bet.current / 100;
                const points = Math.floor(basePoints * betMultiplier);

                if (!isInitial || totalCascade > 1) {
                    totalWon += points;
                }

                matches.forEach(pos => {
                    const [r, c] = pos.split(',').map(Number);
                    const type = game.board[r][c];
                    if (type === null) return;

                    const x = c * TILE_SIZE + TILE_SIZE / 2;
                    const y = r * TILE_SIZE + TILE_SIZE / 2;
                    createParticles(x, y, FRUIT_TYPES[type].color, 6);
                    game.board[r][c] = null;
                });

                if (matches.size > 0) {
                    const positions = [...matches].map(p => p.split(',').map(Number));
                    const avgR = positions.reduce((s, p) => s + p[0], 0) / positions.length;
                    const avgC = positions.reduce((s, p) => s + p[1], 0) / positions.length;

                    let text = `+${points.toLocaleString('id-ID')}`;
                    if (bonus.active) text += ` 💥x${bonus.multiplier}`;
                    if (totalCascade > 1) text += ` (C${totalCascade})`;

                    const color = bonus.active ? '#FF66FF' : '#333';
                    createFloatingText(
                        avgC * TILE_SIZE + TILE_SIZE / 2,
                        avgR * TILE_SIZE + TILE_SIZE / 2,
                        text, color, 20
                    );
                }

                drawBoard();
                await sleep(220);

                dropTiles();
                drawBoard();
                await sleep(180);
            }

            if (totalWon > 0) {
                addBalance(totalWon);
                createFloatingText(
                    canvas.width / 2,
                    80,
                    `💰 +${totalWon.toLocaleString('id-ID')}`,
                    '#FFD700',
                    32
                );
            }

            if (!findHint()) {
                await sleep(300);
                createFloatingText(canvas.width / 2, canvas.height / 2, 'Shuffling...', '#666', 32);
                await sleep(700);
                autoShuffleIfStuck();
            }
        }

        function dropTiles() {
            for (let c = 0; c < COLS; c++) {
                let writeRow = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (game.board[r][c] !== null) {
                        if (writeRow !== r) {
                            game.board[writeRow][c] = game.board[r][c];
                            game.board[r][c] = null;
                        }
                        writeRow--;
                    }
                }
                for (let r = writeRow; r >= 0; r--) {
                    game.board[r][c] = Math.floor(Math.random() * FRUIT_TYPES.length);
                }
            }
        }

        // ===== EFFECTS =====
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                game.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 3,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.02,
                    color,
                    size: Math.random() * 5 + 3
                });
            }
        }

        function createFloatingText(x, y, text, color, size = 24) {
            game.floatingTexts.push({ x, y, text, color, size, life: 1, vy: -2 });
        }

        function showComboDisplay(text) {
            const el = document.getElementById('comboDisplay');
            el.textContent = text;
            el.classList.remove('pop');
            void el.offsetWidth;
            el.classList.add('pop');
        }

        function updateEffects() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4;
                p.life -= p.decay;
                if (p.life <= 0) game.particles.splice(i, 1);
            }

            for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
                const t = game.floatingTexts[i];
                t.y += t.vy;
                t.life -= 0.015;
                if (t.life <= 0) game.floatingTexts.splice(i, 1);
            }
        }

        // ===== INPUT =====
        let pointerDown = null;

        function getTileFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            const c = Math.floor(x / TILE_SIZE);
            const r = Math.floor(y / TILE_SIZE);

            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return { r, c };
            return null;
        }

        function handleTileSelect(tile) {
            if (game.isAnimating || autoSpin.active || !tile) return;
            game.hintTile = null;

            if (!game.selected) {
                game.selected = tile;
            } else {
                const s = game.selected;
                if (s.r === tile.r && s.c === tile.c) {
                    game.selected = null;
                    drawBoard();
                    return;
                }
                const isAdjacent = Math.abs(s.r - tile.r) + Math.abs(s.c - tile.c) === 1;
                if (isAdjacent) {
                    attemptSwap(s, tile);
                    game.selected = null;
                } else {
                    game.selected = tile;
                }
            }
            drawBoard();
        }

        async function attemptSwap(a, b) {
            if (game.isAnimating) return;
            game.isAnimating = true;

            if (game.balance < bet.current) {
                createFloatingText(canvas.width / 2, canvas.height / 2, '❌ Saldo tidak cukup!', '#ff0000', 28);
                game.isAnimating = false;
                return;
            }

            if (isValidSwap(a.r, a.c, b.r, b.c)) {
                deductBalance(bet.current);
                createFloatingText(canvas.width / 2, canvas.height - 40, `-${bet.current.toLocaleString('id-ID')}`, '#F5576C', 24);

                swapTiles(a.r, a.c, b.r, b.c);
                drawBoard();
                await sleep(150);
                await processMatches();

                if (bonus.active) {
                    bonus.spinsLeft--;
                    updateBonusUI();
                    if (bonus.spinsLeft <= 0) endBonus();
                }
            } else {
                createFloatingText(
                    ((a.c + b.c) / 2) * TILE_SIZE + TILE_SIZE / 2,
                    ((a.r + b.r) / 2) * TILE_SIZE + TILE_SIZE / 2,
                    '❌', '#ff0000', 32
                );
                swapTiles(a.r, a.c, b.r, b.c);
                drawBoard();
                await sleep(150);
                swapTiles(a.r, a.c, b.r, b.c);
                drawBoard();
            }

            game.isAnimating = false;
        }

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const tile = getTileFromEvent(e);
            if (tile) handleTileSelect(tile);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const tile = getTileFromEvent(e);
            if (tile) {
                pointerDown = { tile, x: e.touches[0].clientX, y: e.touches[0].clientY };
                handleTileSelect(tile);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!pointerDown) return;

            const dx = e.changedTouches[0].clientX - pointerDown.x;
            const dy = e.changedTouches[0].clientY - pointerDown.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 20 && !game.isAnimating && !autoSpin.active) {
                let targetR = pointerDown.tile.r;
                let targetC = pointerDown.tile.c;
                if (Math.abs(dx) > Math.abs(dy)) {
                    targetC += dx > 0 ? 1 : -1;
                } else {
                    targetR += dy > 0 ? 1 : -1;
                }
                if (targetR >= 0 && targetR < ROWS && targetC >= 0 && targetC < COLS) {
                    game.selected = null;
                    attemptSwap(pointerDown.tile, { r: targetR, c: targetC });
                }
            }
            pointerDown = null;
        }, { passive: false });

        // ===== FIND HINT (internal, tanpa tombol) =====
        function findHint() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (c < COLS - 1 && isValidSwap(r, c, r, c + 1)) return [{ r, c }, { r, c: c + 1 }];
                    if (r < ROWS - 1 && isValidSwap(r, c, r + 1, c)) return [{ r, c }, { r: r + 1, c }];
                }
            }
            return null;
        }

        // ===== BONUS =====
        function buyBonus(multiplier, cost) {
            if (game.isAnimating) return;

            if (bonus.active && bonus.multiplier === multiplier) {
                endBonus();
                return;
            }

            if (game.balance < cost) {
                showComboDisplay(`❌ Butuh ${cost.toLocaleString('id-ID')}!`);
                return;
            }

            const probability = 1 / multiplier;
            const roll = Math.random();
            const isSuccess = roll < probability;

            deductBalance(cost);

            if (!isSuccess) {
                showComboDisplay(`❌ CRUSH GAGAL!`);
                createFloatingText(
                    canvas.width / 2,
                    canvas.height / 2,
                    `❌ GAGAL`,
                    '#ff0000',
                    48
                );
                createFloatingText(
                    canvas.width / 2,
                    canvas.height / 2 + 40,
                    `-${cost.toLocaleString('id-ID')}`,
                    '#F5576C',
                    24
                );
                for (let i = 0; i < 30; i++) {
                    game.particles.push({
                        x: canvas.width / 2,
                        y: canvas.height / 2,
                        vx: (Math.random() - 0.5) * 12,
                        vy: (Math.random() - 0.5) * 12,
                        life: 1,
                        decay: 0.02,
                        color: '#ff0000',
                        size: Math.random() * 6 + 3
                    });
                }
                return;
            }

            if (bonus.active) endBonus();

            bonus.active = true;
            bonus.multiplier = multiplier;
            bonus.totalSpins = 10;
            bonus.spinsLeft = bonus.totalSpins;

            updateBonusUI();
            renderBonusButtons();

            showComboDisplay(`🎉 BONUS ${multiplier}x!`);
            createFloatingText(
                canvas.width / 2,
                canvas.height / 2,
                `🎉 x${multiplier} AKTIF!`,
                '#FF66FF',
                48
            );

            for (let i = 0; i < 50; i++) {
                game.particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1,
                    decay: 0.015,
                    color: ['#FFD700', '#FF66FF', '#84fab0'][Math.floor(Math.random() * 3)],
                    size: Math.random() * 8 + 4
                });
            }
        }

        function endBonus() {
            if (!bonus.active) return;
            const mult = bonus.multiplier;
            bonus.active = false;
            bonus.multiplier = 0;
            bonus.spinsLeft = 0;
            bonus.totalSpins = 0;

            document.getElementById('bonusStatus').textContent = 'OFF';
            document.getElementById('bonusStatus').classList.remove('active');
            renderBonusButtons();

            createFloatingText(canvas.width / 2, canvas.height / 2, `Bonus ${mult}x Berakhir`, '#888', 28);
        }

        function updateBonusUI() {
            if (bonus.active) {
                document.getElementById('bonusStatus').textContent = `x${bonus.multiplier} • ${bonus.spinsLeft} SPIN`;
                document.getElementById('bonusStatus').classList.add('active');
            } else {
                document.getElementById('bonusStatus').textContent = 'OFF';
                document.getElementById('bonusStatus').classList.remove('active');
            }
        }

        // ===== AUTO SPIN =====
        function selectAutoSpin(count) {
            if (game.isAnimating) return;
            if (autoSpin.active) {
                stopAutoSpin();
                return;
            }

            if (game.balance < bet.current) {
                showComboDisplay('❌ Saldo tidak cukup!');
                return;
            }

            autoSpin.selected = count;
            autoSpin.isUnlimited = count >= 999999;
            autoSpin.total = autoSpin.isUnlimited ? Infinity : count;
            autoSpin.remaining = autoSpin.total;
            autoSpin.active = true;
            autoSpin.spinCount = 0;

            document.querySelectorAll('.spin-btn').forEach(b => {
                b.classList.remove('selected', 'spinning');
                if (parseInt(b.dataset.spins) === count) b.classList.add('selected');
            });

            document.getElementById('autospinStatus').textContent = autoSpin.isUnlimited ? '∞ AUTO' : `${count}x AUTO`;
            document.getElementById('autospinStatus').classList.add('active');
            document.getElementById('stopBtn').disabled = false;

            setTimeout(() => autoSpinTick(), 400);
        }

        function stopAutoSpin() {
            autoSpin.active = false;
            if (autoSpin.timeoutId) {
                clearTimeout(autoSpin.timeoutId);
                autoSpin.timeoutId = null;
            }

            document.querySelectorAll('.spin-btn').forEach(b => {
                b.classList.remove('spinning', 'selected');
                const progress = b.querySelector('.spin-progress');
                if (progress) progress.style.width = '0%';
            });

            document.getElementById('autospinStatus').textContent = 'OFF';
            document.getElementById('autospinStatus').classList.remove('active');
            document.getElementById('stopBtn').disabled = true;
        }

        async function autoSpinTick() {
            if (!autoSpin.active) {
                stopAutoSpin();
                return;
            }

            if (!autoSpin.isUnlimited && autoSpin.remaining <= 0) {
                stopAutoSpin();
                createFloatingText(canvas.width / 2, canvas.height / 2, '✅ AUTO SELESAI!', '#FFD700', 32);
                return;
            }

            if (game.balance < bet.current) {
                stopAutoSpin();
                createFloatingText(canvas.width / 2, canvas.height / 2, '❌ Saldo Habis!', '#ff0000', 32);
                return;
            }

            const selectedBtn = document.querySelector('.spin-btn.selected');
            if (selectedBtn) selectedBtn.classList.add('spinning');

            const hint = findHint();
            if (!hint) {
                autoShuffleIfStuck();
                await sleep(300);
            }

            const move = findHint();
            if (!move) {
                autoSpin.timeoutId = setTimeout(() => autoSpinTick(), 500);
                return;
            }

            game.hintTile = null;
            game.selected = null;
            await attemptSwap(move[0], move[1]);

            autoSpin.spinCount++;
            if (!autoSpin.isUnlimited) autoSpin.remaining--;

            if (selectedBtn) {
                selectedBtn.classList.remove('spinning');
                const progress = selectedBtn.querySelector('.spin-progress');
                if (progress) {
                    if (autoSpin.isUnlimited) {
                        progress.style.width = '100%';
                    } else {
                        const pct = ((autoSpin.total - autoSpin.remaining) / autoSpin.total) * 100;
                        progress.style.width = pct + '%';
                    }
                }
            }

            if (autoSpin.active) {
                autoSpin.timeoutId = setTimeout(() => autoSpinTick(), autoSpin.delayMs);
            }
        }

        function closeOverlay() {
            document.getElementById('overlay').classList.remove('show');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ===== LOOP =====
        function gameLoop() {
            updateEffects();
            if (game.hintTimer > 0) {
                game.hintTimer--;
                if (game.hintTimer === 0) game.hintTile = null;
            }
            drawBoard();
            requestAnimationFrame(gameLoop);
        }

        // ===== INIT =====
        function init() {
            initBoard();
            renderBonusButtons();
            updateBetUI();
            updateBalanceUI();
            processMatches(true).then(() => {
                drawBoard();
            });
            drawBoard();
            gameLoop();
        }

        init();
    </script>
</body>
  </html>
