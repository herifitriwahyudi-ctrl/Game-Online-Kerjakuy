<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFD700">
    <link rel="manifest" href="manifest.json">
    <title>🔐 Login — Fruit Crush</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }
        .box {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 25px 70px rgba(0,0,0,0.8), 0 0 0 3px rgba(255, 215, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.4);
        }
        h1 {
            text-align: center;
            font-size: 1.6em;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }
        .sub { text-align: center; color: #888; font-size: 0.8em; margin-bottom: 20px; }
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 12px;
        }
        .tab {
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            color: #888;
            transition: all 0.2s;
        }
        .tab.active {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #333;
        }
        .form-group { margin-bottom: 14px; }
        .form-label {
            display: block;
            font-size: 0.75em;
            color: #00D4FF;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 1em;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: #00D4FF;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #333;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .alert {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 0.85em;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        .alert.show { display: block; }
        .alert.error { background: rgba(255, 60, 60, 0.2); border: 1px solid #ff3c3c; color: #ff8888; }
        .alert.success { background: rgba(0, 184, 148, 0.2); border: 1px solid #00b894; color: #84fab0; }
        .info {
            text-align: center;
            color: #888;
            font-size: 0.75em;
            margin-top: 15px;
            line-height: 1.5;
        }
        .info b { color: #FFD700; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🍎 FRUIT CRUSH 🍊</h1>
        <div class="sub">Login untuk bermain & menyimpan saldo</div>

        <div class="tabs">
            <div class="tab active" id="tabLogin" onclick="switchTab('login')">MASUK</div>
            <div class="tab" id="tabRegister" onclick="switchTab('register')">DAFTAR</div>
        </div>

        <div class="alert" id="alertBox"></div>

        <div id="formLogin">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="loginEmail" placeholder="email@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="loginPass" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">🔓 MASUK</button>
        </div>

        <div id="formRegister" style="display:none;">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="regUsername" placeholder="username unik" maxlength="20" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="regEmail" placeholder="email@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label">Password (min 6)</label>
                <input type="password" class="form-input" id="regPass" placeholder="••••••••" autocomplete="new-password">
            </div>
            <button class="btn btn-primary" id="btnRegister" onclick="doRegister()">📝 DAFTAR</button>
        </div>

        <div class="info">
            Dengan masuk, kamu setuju saldo <b>tersinkron</b> di semua device.<br>
            Bonus awal <b>Rp 10.000</b> untuk user baru! 🎁
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nextPage = params.get('next') || 'index.html';

        FB.registerSW();

        function showAlert(msg, type = 'error') {
            const el = document.getElementById('alertBox');
            el.textContent = msg;
            el.className = 'alert show ' + type;
        }

        function switchTab(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('formLogin').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('formRegister').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('alertBox').classList.remove('show');
        }

        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;

            if (!email || !pass) {
                showAlert('Email & password wajib diisi!');
                return;
            }

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.textContent = '⏳ MEMPROSES...';

            try {
                await FB.auth.signInWithEmailAndPassword(email, pass);
                showAlert('✅ Login berhasil! Mengalihkan...', 'success');
                setTimeout(() => {
                    window.location.href = nextPage;
                }, 800);
            } catch (e) {
                console.error(e);
                let msg = 'Login gagal. ';
                if (e.code === 'auth/user-not-found') msg = 'Email belum terdaftar.';
                else if (e.code === 'auth/wrong-password') msg = 'Password salah.';
                else if (e.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
                else if (e.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan. Coba lagi nanti.';
                else if (e.code === 'auth/invalid-credential') msg = 'Email atau password salah.';
                else msg += e.message;
                showAlert(msg);
                btn.disabled = false;
                btn.textContent = '🔓 MASUK';
            }
        }

        async function doRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;

            if (!username || !email || !pass) {
                showAlert('Semua field wajib diisi!');
                return;
            }
            if (username.length < 3) {
                showAlert('Username minimal 3 karakter.');
                return;
            }
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                showAlert('Username hanya boleh huruf, angka, dan underscore.');
                return;
            }
            if (pass.length < 6) {
                showAlert('Password minimal 6 karakter.');
                return;
            }

            const btn = document.getElementById('btnRegister');
            btn.disabled = true;
            btn.textContent = '⏳ MENDAFTAR...';

            try {
                const check = await FB.db.collection('users')
                    .where('username', '==', username).limit(1).get();
                if (!check.empty) {
                    showAlert('Username sudah dipakai, coba yang lain.');
                    btn.disabled = false;
                    btn.textContent = '📝 DAFTAR';
                    return;
                }

                const cred = await FB.auth.createUserWithEmailAndPassword(email, pass);
                const uid = cred.user.uid;

                await FB.db.collection('users').doc(uid).set({
                    uid,
                    username,
                    email,
                    balance: 10000,
                    role: 'user',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await FB.logTransaction({
                    uid,
                    username,
                    type: 'bonus',
                    amount: 10000,
                    note: 'Bonus pendaftaran'
                });

                showAlert('🎉 Pendaftaran sukses! Mengalihkan...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
            } catch (e) {
                console.error(e);
                let msg = 'Pendaftaran gagal. ';
                if (e.code === 'auth/email-already-in-use') msg = 'Email sudah terdaftar.';
                else if (e.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
                else if (e.code === 'auth/weak-password') msg = 'Password terlalu lemah.';
                else if (e.code === 'permission-denied') msg = 'Akses ditolak — cek Firestore rules.';
                else msg += e.message;
                showAlert(msg);
                btn.disabled = false;
                btn.textContent = '📝 DAFTAR';
            }
        }

        FB.auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = nextPage;
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('formLogin').style.display !== 'none') {
                    doLogin();
                } else {
                    doRegister();
                }
            }
        });
    </script>
</body>
</html>
