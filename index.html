<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>KERJA KUY! - Arcade Kantor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
  }
  #gameWrap {
    text-align: center;
    position: relative;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
    color: #ffd700;
    text-shadow: 0 0 10px #ffd700;
    letter-spacing: 2px;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    padding: 10px 20px;
    background: rgba(0,0,0,0.5);
    border-radius: 10px 10px 0 0;
    font-size: 14px;
  }
  #hud span { color: #00ff88; font-weight: bold; }
  #hud .danger { color: #ff4444; }
  canvas {
    display: block;
    background: #0f0f1e;
    border: 3px solid #ffd700;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 0 30px rgba(255,215,0,0.3);
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { color: #ffd700; font-size: 32px; margin-bottom: 15px; }
  #overlay p { margin: 6px 0; font-size: 15px; line-height: 1.5; }
  .key { background: #333; padding: 2px 8px; border-radius: 4px; border: 1px solid #666; }
  button {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 18px;
    font-family: inherit;
    background: #ffd700;
    color: #1a1a2e;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.1s;
  }
  button:hover { transform: scale(1.05); background: #fff; }
  .legend { display: flex; gap: 15px; margin-top: 15px; font-size: 13px; }
  .legend div { display: flex; align-items: center; gap: 5px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
</style>
</head>
<body>
<div id="gameWrap">
  <h1>💼 KERJA KUY! 💼</h1>
  <div id="hud">
    <div>📊 SKOR: <span id="score">0</span></div>
    <div>⚡ ENERGI: <span id="energy">100</span></div>
    <div>📈 LEVEL: <span id="level">1</span></div>
  </div>
  <canvas id="canvas" width="700" height="450"></canvas>

  <div id="overlay">
    <h2>🎯 KERJA KUY!</h2>
    <p>Kamu adalah karyawan yang harus <b>menyelesaikan tugas</b> 📄</p>
    <p>Gerakkan dengan <span class="key">←</span> <span class="key">→</span> atau <span class="key">A</span>/<span class="key">D</span></p>
    <div class="legend">
      <div><div class="dot" style="background:#4ecdc4"></div> Tugas (+10 skor)</div>
      <div><div class="dot" style="background:#ff6b6b"></div> Distraksi (-energi)</div>
      <div><div class="dot" style="background:#ffd700"></div> Kopi (+energi)</div>
    </div>
    <p style="margin-top:15px; color:#aaa; font-size:13px;">Game over jika energi habis! Jangan biarkan tugas menumpuk 📚</p>
    <button onclick="startGame()">MULAI KERJA ▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let player, items, score, energy, level, gameRunning, keys, spawnTimer, frameCount;
let particles = [];

function init() {
  player = { x: W/2, y: H - 60, w: 50, h: 50, speed: 6 };
  items = [];
  score = 0;
  energy = 100;
  level = 1;
  frameCount = 0;
  spawnTimer = 0;
  particles = [];
  keys = {};
  gameRunning = true;
  updateHUD();
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('energy').textContent = Math.max(0, Math.round(energy));
  document.getElementById('level').textContent = level;
}

const TYPES = {
  task:  { color: '#4ecdc4', emoji: '📄', points: 10, energy: 0,   size: 22, label: 'tugas' },
  distract: { color: '#ff6b6b', emoji: '📱', points: 0, energy: -20, size: 22, label: 'distraksi' },
  coffee: { color: '#ffd700', emoji: '☕', points: 5, energy: 25, size: 20, label: 'kopi' }
};

function spawnItem() {
  const r = Math.random();
  let type;
  if (r < 0.55) type = 'task';
  else if (r < 0.85) type = 'distract';
  else type = 'coffee';

  const speed = 1.8 + level * 0.4 + Math.random() * 1.2;
  items.push({
    x: 30 + Math.random() * (W - 60),
    y: -30,
    type: type,
    speed: speed,
    ...TYPES[type]
  });
}

function drawPlayer() {
  // Meja kerja
  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(player.x - 30, player.y + 25, 60, 8);
  
  // Badan karyawan
  ctx.fillStyle = '#4a90e2';
  ctx.fillRect(player.x - 18, player.y - 5, 36, 35);
  
  // Kepala
  ctx.fillStyle = '#f5cba7';
  ctx.beginPath();
  ctx.arc(player.x, player.y - 18, 14, 0, Math.PI * 2);
  ctx.fill();
  
  // Rambut
  ctx.fillStyle = '#2c1810';
  ctx.beginPath();
  ctx.arc(player.x, player.y - 22, 14, Math.PI, 0);
  ctx.fill();
  
  // Mata (lelah)
  ctx.fillStyle = '#000';
  ctx.fillRect(player.x - 7, player.y - 18, 3, 3);
  ctx.fillRect(player.x + 4, player.y - 18, 3, 3);
  
  // Laptop
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(player.x - 12, player.y + 15, 24, 14);
  ctx.fillStyle = '#3498db';
  ctx.fillRect(player.x - 10, player.y + 17, 20, 10);
}

function drawItem(item) {
  // Glow
  ctx.shadowColor = item.color;
  ctx.shadowBlur = 15;
  
  ctx.fillStyle = item.color;
  ctx.beginPath();
  ctx.arc(item.x, item.y, item.size, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.shadowBlur = 0;
  
  // Emoji
  ctx.font = '22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(item.emoji, item.x, item.y + 2);
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      size: 2 + Math.random() * 3,
      color, life: 1
    });
  }
}

function drawBackground() {
  // Lantai kantor
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  
  // Grid pola
  ctx.strokeStyle = 'rgba(255,215,0,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 40) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, H);
    ctx.stroke();
  }
  for (let i = 0; i < H; i += 40) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(W, i);
    ctx.stroke();
  }
  
  // Garis lantai
  ctx.strokeStyle = 'rgba(255,215,0,0.3)';
  ctx.beginPath();
  ctx.moveTo(0, H - 30);
  ctx.lineTo(W, H - 30);
  ctx.stroke();
}

function checkCollision(a, b) {
  return Math.abs(a.x - b.x) < 30 + b.size*0.6 && Math.abs(a.y - b.y) < 25 + b.size*0.6;
}

function update() {
  if (!gameRunning) return;
  
  frameCount++;
  
  // Gerak player
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
  player.x = Math.max(40, Math.min(W - 40, player.x));
  
  // Spawn item
  spawnTimer++;
  const spawnRate = Math.max(25, 55 - level * 4);
  if (spawnTimer > spawnRate) {
    spawnItem();
    spawnTimer = 0;
  }
  
  // Update items
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.speed;
    
    // Collision dengan player
    if (checkCollision(player, it)) {
      if (it.type === 'task') {
        score += it.points;
        addParticles(it.x, it.y, '#4ecdc4', 12);
      } else if (it.type === 'distract') {
        energy += it.energy;
        addParticles(it.x, it.y, '#ff6b6b', 15);
        // Efek getar
        canvas.style.transform = 'translate(3px,3px)';
        setTimeout(() => canvas.style.transform = 'translate(0,0)', 50);
      } else if (it.type === 'coffee') {
        score += it.points;
        energy = Math.min(100, energy + it.energy);
        addParticles(it.x, it.y, '#ffd700', 10);
      }
      items.splice(i, 1);
      updateHUD();
      continue;
    }
    
    // Item jatuh ke bawah = energi berkurang (tugas menumpuk!)
    if (it.y > H + 30) {
      if (it.type === 'task') {
        energy -= 8; // Tugas tidak selesai = stres!
      }
      items.splice(i, 1);
      updateHUD();
    }
  }
  
  // Level naik berdasarkan skor
  const newLevel = Math.floor(score / 100) + 1;
  if (newLevel > level) {
    level = newLevel;
    updateHUD();
  }
  
  // Cek game over
  if (energy <= 0) {
    gameOver();
  }
  
  // Energi berkurang perlahan (lembur)
  if (frameCount % 120 === 0) {
    energy -= 1;
    updateHUD();
  }
}

function draw() {
  drawBackground();
  items.forEach(drawItem);
  drawPlayer();
  drawParticles();
  
  // Efek low energy
  if (energy < 30) {
    ctx.fillStyle = `rgba(255,0,0,${0.1 + Math.sin(frameCount * 0.2) * 0.05})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  gameRunning = false;
  const overlay = document.getElementById('overlay');
  let rating = score >= 300 ? '🌟 KARYAWAN TELADAN!' : 
               score >= 150 ? '👍 KERJA BAGUS!' : 
               score >= 50 ? '😅 CUKUP LAH...' : '😴 KETIDURAN YA?';
  overlay.innerHTML = `
    <h2>⏰ PULANG KERJA!</h2>
    <p style="font-size:20px; color:#ffd700; margin:15px 0;">Skor Akhir: ${score}</p>
    <p style="font-size:18px;">${rating}</p>
    <p style="color:#aaa; margin-top:10px;">Level tercapai: ${level}</p>
    <button onclick="restart()">KERJA LAGI ▶</button>
  `;
  overlay.classList.remove('hidden');
}

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  init();
}

function restart() {
  startGame();
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  if (x < W/2) keys['ArrowLeft'] = true;
  else keys['ArrowRight'] = true;
});
canvas.addEventListener('touchend', e => {
  keys['ArrowLeft'] = false;
  keys['ArrowRight'] = false;
});

// Init awal
init();
gameRunning = false;
loop();
</script>
</body>
</html>
