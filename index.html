<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍎 Fruit Crush - Match 3 Game 🍊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .game-container {
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }

        .subtitle {
            color: #888;
            font-size: 0.9em;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 8px;
        }

        .stat-box {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 5px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stat-label {
            font-size: 0.7em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 2px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #84fab0 0%, #8fd3f4 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(132, 250, 176, 0.6);
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            border-radius: 15px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.1);
            cursor: pointer;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 0.95em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            color: #333;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-shuffle {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .btn-hint {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 25px;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            padding: 30px;
            text-align: center;
            color: white;
        }

        .overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .overlay h2 {
            font-size: 2.5em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay p {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .overlay .big-score {
            font-size: 3em;
            font-weight: bold;
            color: #FFD700;
            margin: 15px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .overlay button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 4em;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 100, 0, 0.6);
            pointer-events: none;
            z-index: 50;
            opacity: 0;
        }

        .combo-display.pop {
            animation: comboPop 0.8s ease-out;
        }

        @keyframes comboPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        .targets {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .target-item {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85em;
            font-weight: bold;
            color: #555;
            transition: all 0.3s;
        }

        .target-item.completed {
            background: #84fab0;
            border-color: #84fab0;
            color: #333;
            transform: scale(1.05);
        }

        .target-item .emoji {
            font-size: 1.2em;
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.5em; }
            .stat-value { font-size: 1em; }
            .stat-label { font-size: 0.6em; }
            button { padding: 8px 15px; font-size: 0.85em; }
            .overlay h2 { font-size: 1.8em; }
            .overlay .big-score { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🍎 Fruit Crush 🍊</h1>
            <div class="subtitle">Cocokkan 3 buah atau lebih!</div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Skor</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Langkah</div>
                <div class="stat-value" id="moves">30</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="targets" id="targets"></div>

        <canvas id="gameCanvas" width="480" height="480"></canvas>

        <div class="controls">
            <button class="btn-hint" onclick="showHint()">💡 Hint</button>
            <button class="btn-shuffle" onclick="shuffleBoard()">🔀 Shuffle</button>
            <button class="btn-reset" onclick="resetGame()">🔄 Reset</button>
        </div>

        <div class="combo-display" id="comboDisplay">COMBO!</div>

        <div class="overlay" id="overlay">
            <h2 id="overlayTitle">🎉 Level Complete!</h2>
            <p id="overlayText">Hebat! Kamu berhasil!</p>
            <div class="big-score" id="overlayScore">0</div>
            <button onclick="nextLevel()" id="overlayBtn">▶️ Lanjut</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game config
        const ROWS = 8;
        const COLS = 8;
        const TILE_SIZE = canvas.width / COLS;

        // Fruit types (max 6 types for balance)
        const FRUIT_TYPES = [
            { emoji: '🍎', color: '#ff4444', name: 'Apel' },
            { emoji: '🍊', color: '#ff8800', name: 'Jeruk' },
            { emoji: '🍇', color: '#9944ff', name: 'Anggur' },
            { emoji: '🍋', color: '#ffdd00', name: 'Lemon' },
            { emoji: '🍓', color: '#ff2266', name: 'Strawberry' },
            { emoji: '🥝', color: '#88cc00', name: 'Kiwi' }
        ];

        // Game state
        let game = {
            board: [],
            score: 0,
            moves: 30,
            level: 1,
            targetScore: 1000,
            selected: null,
            isAnimating: false,
            combo: 0,
            particles: [],
            floatingTexts: [],
            hintTile: null,
            hintTimer: 0,
            targets: [],
            gameOver: false
        };

        // ===== INITIALIZATION =====
        function initBoard() {
            game.board = [];
            for (let r = 0; r < ROWS; r++) {
                game.board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    let type;
                    do {
                        type = Math.floor(Math.random() * FRUIT_TYPES.length);
                    } while (wouldMatch(r, c, type));
                    game.board[r][c] = type;
                }
            }
            // Ensure there's at least one valid move
            if (!findHint()) {
                shuffleBoard(false);
            }
        }

        function wouldMatch(row, col, type) {
            // Check horizontal
            if (col >= 2) {
                if (game.board[row][col-1] === type && game.board[row][col-2] === type) return true;
            }
            // Check vertical
            if (row >= 2) {
                if (game.board[row-1][col] === type && game.board[row-2][col] === type) return true;
            }
            return false;
        }

        function initTargets() {
            // Pick 2-3 random fruit types as targets
            const numTargets = Math.min(3, FRUIT_TYPES.length);
            const shuffled = [...Array(FRUIT_TYPES.length).keys()].sort(() => Math.random() - 0.5);
            game.targets = [];
            for (let i = 0; i < numTargets; i++) {
                const typeIndex = shuffled[i];
                game.targets.push({
                    type: typeIndex,
                    required: 15 + game.level * 5,
                    collected: 0
                });
            }
            updateTargetsUI();
        }

        function updateTargetsUI() {
            const container = document.getElementById('targets');
            container.innerHTML = '';
            game.targets.forEach(t => {
                const div = document.createElement('div');
                div.className = 'target-item' + (t.collected >= t.required ? ' completed' : '');
                div.innerHTML = `<span class="emoji">${FRUIT_TYPES[t.type].emoji}</span><span>${Math.min(t.collected, t.required)}/${t.required}</span>`;
                container.appendChild(div);
            });
        }

        // ===== DRAWING =====
        function drawBoard() {
            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid background
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;
                    
                    // Checkerboard background
                    ctx.fillStyle = (r + c) % 2 === 0 ? '#fff5e6' : '#ffe8cc';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                }
            }

            // Draw fruits
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const type = game.board[r][c];
                    if (type === null || type === undefined) continue;

                    const x = c * TILE_SIZE + TILE_SIZE / 2;
                    const y = r * TILE_SIZE + TILE_SIZE / 2;
                    
                    // Selection glow
                    if (game.selected && game.selected.r === r && game.selected.c === c) {
                        ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
                        ctx.beginPath();
                        ctx.arc(x, y, TILE_SIZE * 0.48, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.strokeStyle = '#FFD700';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }

                    // Hint glow
                    if (game.hintTile && game.hintTile.r === r && game.hintTile.c === c) {
                        const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
                        ctx.fillStyle = `rgba(132, 250, 176, ${pulse * 0.5})`;
                        ctx.beginPath();
                        ctx.arc(x, y, TILE_SIZE * 0.45, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Draw fruit emoji
                    ctx.save();
                    ctx.font = `${TILE_SIZE * 0.7}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Subtle shadow
                    ctx.shadowColor = 'rgba(0,0,0,0.15)';
                    ctx.shadowBlur = 5;
                    ctx.shadowOffsetY = 2;
                    
                    ctx.fillText(FRUIT_TYPES[type].emoji, x, y);
                    ctx.restore();
                }
            }

            // Draw particles
            game.particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Draw floating texts
            game.floatingTexts.forEach(t => {
                ctx.globalAlpha = t.life;
                ctx.fillStyle = t.color;
                ctx.font = `bold ${t.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.strokeText(t.text, t.x, t.y);
                ctx.fillText(t.text, t.x, t.y);
                ctx.globalAlpha = 1;
            });
        }

        // ===== MATCH DETECTION =====
        function findMatches() {
            const matches = new Set();
            
            // Horizontal matches
            for (let r = 0; r < ROWS; r++) {
                let count = 1;
                for (let c = 1; c <= COLS; c++) {
                    if (c < COLS && game.board[r][c] !== null && game.board[r][c] === game.board[r][c-1]) {
                        count++;
                    } else {
                        if (count >= 3 && game.board[r][c-1] !== null) {
                            for (let k = c - count; k < c; k++) {
                                matches.add(`${r},${k}`);
                            }
                        }
                        count = 1;
                    }
                }
            }

            // Vertical matches
            for (let c = 0; c < COLS; c++) {
                let count = 1;
                for (let r = 1; r <= ROWS; r++) {
                    if (r < ROWS && game.board[r][c] !== null && game.board[r][c] === game.board[r-1][c]) {
                        count++;
                    } else {
                        if (count >= 3 && game.board[r-1][c] !== null) {
                            for (let k = r - count; k < r; k++) {
                                matches.add(`${k},${c}`);
                            }
                        }
                        count = 1;
                    }
                }
            }

            return matches;
        }

        // ===== SWAP LOGIC =====
        function swapTiles(r1, c1, r2, c2) {
            const temp = game.board[r1][c1];
            game.board[r1][c1] = game.board[r2][c2];
            game.board[r2][c2] = temp;
        }

        function isValidSwap(r1, c1, r2, c2) {
            swapTiles(r1, c1, r2, c2);
            const matches = findMatches();
            swapTiles(r1, c1, r2, c2);
            return matches.size > 0;
        }

        // ===== CASCADE & REMOVE =====
        async function processMatches(isInitial = false) {
            let totalCascade = 0;
            
            while (true) {
                const matches = findMatches();
                if (matches.size === 0) break;

                totalCascade++;
                const matchCount = matches.size;

                // Score calculation
                const baseScore = 10;
                const sizeBonus = matchCount > 3 ? (matchCount - 3) * 10 : 0;
                const cascadeMultiplier = 1 + (totalCascade - 1) * 0.5;
                const points = Math.floor((baseScore * matchCount + sizeBonus) * cascadeMultiplier);
                
                if (!isInitial || totalCascade > 1) {
                    game.score += points;
                }

                // Track targets
                const matchedTypes = {};
                
                // Create particles & remove tiles
                matches.forEach(pos => {
                    const [r, c] = pos.split(',').map(Number);
                    const type = game.board[r][c];
                    if (type === null) return;
                    
                    matchedTypes[type] = (matchedTypes[type] || 0) + 1;
                    
                    // Particles
                    const x = c * TILE_SIZE + TILE_SIZE / 2;
                    const y = r * TILE_SIZE + TILE_SIZE / 2;
                    createParticles(x, y, FRUIT_TYPES[type].color, 6);
                    
                    game.board[r][c] = null;
                });

                // Update targets
                Object.keys(matchedTypes).forEach(type => {
                    const t = game.targets.find(t => t.type === parseInt(type));
                    if (t) t.collected += matchedTypes[type];
                });

                // Floating text at center
                if (matches.size > 0) {
                    const positions = [...matches].map(p => p.split(',').map(Number));
                    const avgR = positions.reduce((s, p) => s + p[0], 0) / positions.length;
                    const avgC = positions.reduce((s, p) => s + p[1], 0) / positions.length;
                    
                    const text = totalCascade > 1 ? `+${points} (x${totalCascade})` : `+${points}`;
                    const color = totalCascade > 1 ? '#FFD700' : '#333';
                    createFloatingText(
                        avgC * TILE_SIZE + TILE_SIZE / 2,
                        avgR * TILE_SIZE + TILE_SIZE / 2,
                        text, color, totalCascade > 1 ? 32 : 24
                    );

                    if (totalCascade > 1) {
                        showComboDisplay(`COMBO x${totalCascade}!`);
                    }
                }

                updateUI();
                updateTargetsUI();
                drawBoard();
                
                // Wait for visual effect
                await sleep(250);

                // Drop tiles
                dropTiles();
                drawBoard();
                await sleep(200);
            }

            // Check target completion
            if (game.targets.every(t => t.collected >= t.required)) {
                await sleep(300);
                levelComplete();
                return;
            }

            // Check if any valid moves remain
            if (!findHint()) {
                await sleep(300);
                createFloatingText(canvas.width / 2, canvas.height / 2, 'Shuffling...', '#666', 32);
                await sleep(800);
                do {
                    shuffleBoard(false);
                } while (!findHint() || findMatches().size > 0);
            }
        }

        function dropTiles() {
            for (let c = 0; c < COLS; c++) {
                let writeRow = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (game.board[r][c] !== null) {
                        if (writeRow !== r) {
                            game.board[writeRow][c] = game.board[r][c];
                            game.board[r][c] = null;
                        }
                        writeRow--;
                    }
                }
                // Fill empty spots at top with new random fruits
                for (let r = writeRow; r >= 0; r--) {
                    game.board[r][c] = Math.floor(Math.random() * FRUIT_TYPES.length);
                }
            }
        }

        // ===== EFFECTS =====
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                game.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 3,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.02,
                    color,
                    size: Math.random() * 5 + 3
                });
            }
        }

        function createFloatingText(x, y, text, color, size = 24) {
            game.floatingTexts.push({
                x, y, text, color, size,
                life: 1,
                vy: -2
            });
        }

        function showComboDisplay(text) {
            const el = document.getElementById('comboDisplay');
            el.textContent = text;
            el.classList.remove('pop');
            void el.offsetWidth;
            el.classList.add('pop');
        }

        function updateEffects() {
            // Update particles
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4;
                p.life -= p.decay;
                if (p.life <= 0) game.particles.splice(i, 1);
            }

            // Update floating texts
            for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
                const t = game.floatingTexts[i];
                t.y += t.vy;
                t.life -= 0.015;
                if (t.life <= 0) game.floatingTexts.splice(i, 1);
            }
        }

        // ===== INPUT HANDLING =====
        let pointerDown = null;

        function getTileFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            
            const c = Math.floor(x / TILE_SIZE);
            const r = Math.floor(y / TILE_SIZE);
            
            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                return { r, c };
            }
            return null;
        }

        function handleTileSelect(tile) {
            if (game.isAnimating || game.gameOver || !tile) return;

            // Clear hint
            game.hintTile = null;

            if (!game.selected) {
                game.selected = tile;
            } else {
                const s = game.selected;
                // If same tile, deselect
                if (s.r === tile.r && s.c === tile.c) {
                    game.selected = null;
                    return;
                }

                // Check if adjacent
                const isAdjacent = Math.abs(s.r - tile.r) + Math.abs(s.c - tile.c) === 1;
                
                if (isAdjacent) {
                    attemptSwap(s, tile);
                    game.selected = null;
                } else {
                    game.selected = tile;
                }
            }
            drawBoard();
        }

        async function attemptSwap(a, b) {
            if (game.isAnimating) return;
            
            game.isAnimating = true;
            
            if (isValidSwap(a.r, a.c, b.r, b.c)) {
                // Valid swap
                swapTiles(a.r, a.c, b.r, b.c);
                game.moves--;
                updateUI();
                drawBoard();
                await sleep(150);
                
                await processMatches();
            } else {
                // Invalid swap - animate and revert
                createFloatingText(
                    ((a.c + b.c) / 2) * TILE_SIZE + TILE_SIZE / 2,
                    ((a.r + b.r) / 2) * TILE_SIZE + TILE_SIZE / 2,
                    '❌', '#ff0000', 32
                );
                
                swapTiles(a.r, a.c, b.r, b.c);
                drawBoard();
                await sleep(150);
                swapTiles(a.r, a.c, b.r, b.c);
                drawBoard();
            }
            
            game.isAnimating = false;
            
            // Check game over
            if (game.moves <= 0 && !game.targets.every(t => t.collected >= t.required)) {
                gameOver();
            }
        }

        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const tile = getTileFromEvent(e);
            if (tile) handleTileSelect(tile);
        });

        // Touch events with swipe support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const tile = getTileFromEvent(e);
            if (tile) {
                pointerDown = { tile, x: e.touches[0].clientX, y: e.touches[0].clientY };
                handleTileSelect(tile);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!pointerDown) return;
            
            const dx = e.changedTouches[0].clientX - pointerDown.x;
            const dy = e.changedTouches[0].clientY - pointerDown.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // Swipe detection
            if (dist > 20 && !game.isAnimating) {
                let targetR = pointerDown.tile.r;
                let targetC = pointerDown.tile.c;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    targetC += dx > 0 ? 1 : -1;
                } else {
                    targetR += dy > 0 ? 1 : -1;
                }
                
                if (targetR >= 0 && targetR < ROWS && targetC >= 0 && targetC < COLS) {
                    game.selected = null;
                    attemptSwap(pointerDown.tile, { r: targetR, c: targetC });
                }
            }
            pointerDown = null;
        }, { passive: false });

        // ===== HINT SYSTEM =====
        function findHint() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    // Try swap right
                    if (c < COLS - 1 && isValidSwap(r, c, r, c + 1)) {
                        return [{ r, c }, { r, c: c + 1 }];
                    }
                    // Try swap down
                    if (r < ROWS - 1 && isValidSwap(r, c, r + 1, c)) {
                        return [{ r, c }, { r: r + 1, c }];
                    }
                }
            }
            return null;
        }

        function showHint() {
            if (game.isAnimating || game.gameOver) return;
            const hint = findHint();
            if (hint) {
                game.hintTile = hint[0];
                game.hintTimer = 180; // frames
                drawBoard();
            }
        }

        // ===== SHUFFLE =====
        function shuffleBoard(animate = true) {
            if (game.isAnimating && animate) return;
            
            // Collect all fruits
            const allFruits = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (game.board[r][c] !== null) {
                        allFruits.push(game.board[r][c]);
                    }
                }
            }
            
            // Shuffle
            for (let i = allFruits.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allFruits[i], allFruits[j]] = [allFruits[j], allFruits[i]];
            }
            
            // Place back
            let idx = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (game.board[r][c] !== null) {
                        game.board[r][c] = allFruits[idx++];
                    }
                }
            }
            
            // Ensure no immediate matches
            let attempts = 0;
            while ((findMatches().size > 0 || !findHint()) && attempts < 100) {
                // Re-shuffle
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (game.board[r][c] !== null) {
                            game.board[r][c] = Math.floor(Math.random() * FRUIT_TYPES.length);
                        }
                    }
                }
                attempts++;
            }
            
            game.selected = null;
            game.hintTile = null;
            drawBoard();
        }

        // ===== UI UPDATES =====
        function updateUI() {
            document.getElementById('score').textContent = game.score;
            document.getElementById('moves').textContent = game.moves;
            document.getElementById('level').textContent = game.level;
            
            const progress = Math.min(100, (game.score / game.targetScore) * 100);
            document.getElementById('progress').style.width = progress + '%';
        }

        // ===== LEVEL MANAGEMENT =====
        function levelComplete() {
            game.gameOver = true;
            const overlay = document.getElementById('overlay');
            document.getElementById('overlayTitle').textContent = '🎉 Level Complete!';
            document.getElementById('overlayText').textContent = `Skor: ${game.score} | Langkah tersisa: ${game.moves}`;
            document.getElementById('overlayScore').textContent = game.score;
            document.getElementById('overlayBtn').textContent = '▶️ Level Berikutnya';
            overlay.classList.add('show');
        }

        function gameOver() {
            game.gameOver = true;
            const overlay = document.getElementById('overlay');
            document.getElementById('overlayTitle').textContent = '💔 Game Over';
            document.getElementById('overlayText').textContent = 'Langkah habis! Coba lagi ya!';
            document.getElementById('overlayScore').textContent = game.score;
            document.getElementById('overlayBtn').textContent = '🔄 Coba Lagi';
            overlay.classList.add('show');
        }

        function nextLevel() {
            document.getElementById('overlay').classList.remove('show');
            
            if (game.targets.every(t => t.collected >= t.required)) {
                // Next level
                game.level++;
                game.moves = 30 + Math.min(10, game.level * 2);
                game.targetScore = 1000 + (game.level - 1) * 500;
                game.gameOver = false;
                initTargets();
                initBoard();
                updateUI();
                drawBoard();
            } else {
                // Restart
                resetGame();
            }
        }

        function resetGame() {
            document.getElementById('overlay').classList.remove('show');
            
            game.score = 0;
            game.moves = 30;
            game.level = 1;
            game.targetScore = 1000;
            game.selected = null;
            game.isAnimating = false;
            game.combo = 0;
            game.particles = [];
            game.floatingTexts = [];
            game.hintTile = null;
            game.gameOver = false;
            
            initTargets();
            initBoard();
            
            // Remove initial matches silently
            processMatches(true).then(() => {
                updateUI();
                drawBoard();
            });
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ===== GAME LOOP =====
        function gameLoop() {
            updateEffects();
            
            if (game.hintTimer > 0) {
                game.hintTimer--;
                if (game.hintTimer === 0) {
                    game.hintTile = null;
                }
            }
            
            drawBoard();
            requestAnimationFrame(gameLoop);
        }

        // ===== INITIALIZE =====
        function init() {
            initTargets();
            initBoard();
            
            // Remove initial matches without scoring
            processMatches(true).then(() => {
                updateUI();
                drawBoard();
            });
            
            updateUI();
            drawBoard();
            gameLoop();
        }

        init();
    </script>
</body>
  </html>
