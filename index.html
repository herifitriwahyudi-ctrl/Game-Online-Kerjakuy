function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  document.getElementById(id).classList.add('show');
}

function goToStatus() {
  const name = document.getElementById('inputName').value.trim();
  const age = parseInt(document.getElementById('inputAge').value);
  if (!name) { alert('Isi nama dulu ya!'); return; }
  if (isNaN(age) || age < 17 || age > 40) { alert('Umur harus 17 - 40 tahun'); return; }
  player.name = name;
  player.age = age;
  player.gender = selectedGender;
  renderStatusGrid();
  showScreen('screenStatus');
}

function backToCreate() {
  showScreen('screenCreate');
}

function renderStatusGrid() {
  const grid = document.getElementById('statusGrid');
  grid.innerHTML = '';
  STATUSES.forEach(st => {
    const card = document.createElement('div');
    card.className = 'status-card';
    card.dataset.id = st.id;
    card.innerHTML = `
      <div class="icon">${st.icon}</div>
      <div class="name">${st.name}</div>
      <div class="desc">${st.desc}</div>
      <div class="stats">💰${st.stats.money} ❤️${st.stats.health} 🧠${100 - st.stats.stress} ⭐${st.stats.rep}</div>
      <div class="trait">${st.trait}</div>
    `;
    card.onclick = () => {
      document.querySelectorAll('.status-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedStatus = st;
      document.getElementById('btnStart').disabled = false;
    };
    grid.appendChild(card);
  });
}

// Gender selector
document.querySelectorAll('.gender-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedGender = btn.dataset.gender;
  };
});

// ============================================================
//  MULAI HIDUP
// ============================================================
function startLife() {
  if (!selectedStatus) return;
  player.status = selectedStatus.id;

  // Set state dari status
  state.money = selectedStatus.stats.money;
  state.health = selectedStatus.stats.health;
  state.stress = selectedStatus.stats.stress;
  state.rep = selectedStatus.stats.rep;
  state.age = player.age;
  state.score = 0;
  state.nextChoiceAge = state.age + 2;
  state.endingTriggered = false;

  // Update player tag
  document.getElementById('tagName').textContent = `${player.name} (${player.gender === 'Laki-laki' ? '♂' : '♀'})`;
  document.getElementById('tagInfo').textContent = `${selectedStatus.icon} ${selectedStatus.name} • ${state.age}th`;
  document.getElementById('playerTag').classList.add('show');

  // Update HUD & canvas border warna sesuai status
  const colors = { pelajar: '#4ecdc4', pekerja: '#4a90e2', pengusaha: '#ffd700', pengangguran: '#ff6b6b' };
  canvas.style.borderColor = colors[player.status];
  document.getElementById('hud').style.borderColor = colors[player.status];

  updateHUD();

  // Tampilkan intro
  document.getElementById('introTitle').textContent = `${selectedStatus.icon} ${player.name.toUpperCase()}`;
  document.getElementById('introText').textContent = selectedStatus.intro;
  document.getElementById('introParadox').innerHTML = `<p><b>TRAIT:</b> ${selectedStatus.trait}</p><p style="margin-top:5px">${selectedStatus.paradox}</p><p style="margin-top:5px; color:#00ff88;">${selectedStatus.bonus}</p>`;
  showScreen('screenIntro');
}

function closeIntro() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  initWorld();
  state.running = true;
}

// ============================================================
//  INIT WORLD (background, particles)
// ============================================================
function initWorld() {
  state.particles = [];
  state.floatingTexts = [];
  state.cityLights = [];
  state.frame = 0;
  state.bgOffset = 0;
  for (let i = 0; i < 60; i++) {
    state.cityLights.push({
      x: Math.random() * W,
      y: 180 + Math.random() * 180,
      size: 1 + Math.random() * 2,
      alpha: 0.3 + Math.random() * 0.6,
      speed: 0.1 + Math.random() * 0.3
    });
  }
  updateHUD();
}

// ============================================================
//  HUD
// ============================================================
function updateHUD() {
  const set = (id, val, warn, danger) => {
    const el = document.getElementById(id);
    el.textContent = Math.round(val);
    el.className = 'val' + (val <= danger ? ' danger' : val <= warn ? ' warn' : '');
  };
  set('money', state.money, 30, 10);
  set('health', state.health, 40, 20);
  set('stress', 100 - state.stress, 40, 20);
  set('rep', state.rep, 30, 10);
  set('age', state.age);

  // Update tag info
  if (player.status) {
    const st = STATUSES.find(s => s.id === player.status);
    document.getElementById('tagInfo').textContent = `${st.icon} ${st.name} • ${state.age}th`;
  }
}

// ============================================================
//  BACKGROUND
// ============================================================
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d0a2a');
  grad.addColorStop(0.5, '#1a1440');
  grad.addColorStop(1, '#0a0a15');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Bintang
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 40; i++) {
    const x = (i * 137.5 + state.frame * 0.1) % W;
    const y = (i * 97.3) % (H * 0.4);
    const a = 0.3 + Math.sin(state.frame * 0.05 + i) * 0.3;
    ctx.globalAlpha = a;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;

  // Gedung
  ctx.fillStyle = '#05050f';
  const buildings = [
    { x: 0, w: 80, h: 180 }, { x: 90, w: 60, h: 220 },
    { x: 160, w: 90, h: 150 }, { x: 260, w: 70, h: 260 },
    { x: 340, w: 100, h: 200 }, { x: 450, w: 80, h: 240 },
    { x: 540, w: 90, h: 170 }, { x: 640, w: 80, h: 210 }
  ];
  buildings.forEach(b => {
    ctx.fillRect(b.x, H - b.h - 30, b.w, b.h);
    ctx.fillStyle = '#ffd700';
    for (let wy = H - b.h - 20; wy < H - 40; wy += 18) {
      for (let wx = b.x + 8; wx < b.x + b.w - 8; wx += 16) {
        if (Math.random() > 0.5 || (state.frame + wx + wy) % 200 < 5) {
          ctx.globalAlpha = 0.5 + Math.sin(state.frame * 0.02 + wx) * 0.3;
          ctx.fillRect(wx, wy, 5, 7);
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#05050f';
  });

  // Lampu kota
  state.cityLights.forEach(l => {
    ctx.globalAlpha = l.alpha * (0.6 + Math.sin(state.frame * 0.05 + l.x) * 0.4);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(l.x, l.y, l.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Jalan
  ctx.fillStyle = '#080810';
  ctx.fillRect(0, H - 60, W, 60);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 15]);
  ctx.beginPath();
  ctx.moveTo(-state.bgOffset % 35, H - 30);
  ctx.lineTo(W, H - 30);
  ctx.stroke();
  ctx.setLineDash([]);
}

// ============================================================
//  KARAKTER (custom gender)
// ============================================================
function drawCharacter() {
  const cx = W / 2;
  const cy = H - 90;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 42, 30, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  if (state.money > 80) {
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(cx - 45, cy + 10, 22, 28);
    ctx.strokeStyle = '#000';
    ctx.strokeRect(cx - 45, cy + 10, 22, 28);
  }

  // Badan (warna stres)
  const stressColor = state.stress > 70 ? '#8b0000' : state.stress > 40 ? '#b8860b' : '#2c5aa0';
  ctx.fillStyle = stressColor;
  ctx.fillRect(cx - 22, cy - 8, 44, 42);

  // Kepala
  ctx.fillStyle = '#f5cba7';
  ctx.beginPath();
  ctx.arc(cx, cy - 25, 18, 0, Math.PI * 2);
  ctx.fill();

  // Rambut (perempuan lebih panjang)
  ctx.fillStyle = state.age > 40 ? '#888' : state.age > 32 ? '#5a4030' : '#2c1810';
  if (player.gender === 'Perempuan') {
    // Rambut panjang
    ctx.beginPath();
    ctx.arc(cx, cy - 28, 20, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(cx - 20, cy - 28, 8, 35);
    ctx.fillRect(cx + 12, cy - 28, 8, 35);
  } else {
    ctx.beginPath();
    ctx.arc(cx, cy - 30, 18, Math.PI, 0);
    ctx.fill();
  }

  // Mata
  ctx.fillStyle = '#000';
  const eyeH = state.stress > 60 ? 1.5 : 3;
  ctx.fillRect(cx - 9, cy - 25, 3, eyeH);
  ctx.fillRect(cx + 6, cy - 25, 3, eyeH);

  // Mulut
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (state.stress > 60) ctx.arc(cx, cy - 14, 6, Math.PI, 0);
  else if (state.stress < 30) ctx.arc(cx, cy - 8, 6, 0, Math.PI);
  else { ctx.moveTo(cx - 5, cy - 12); ctx.lineTo(cx + 5, cy - 12); }
  ctx.stroke();

  // Keringat
  if (state.stress > 60) {
    ctx.fillStyle = '#4ecdc4';
    ctx.beginPath();
    ctx.arc(cx + 16, cy - 28 + Math.sin(state.frame * 0.15) * 3, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Kantong mata
  if (state.health < 50) {
    ctx.strokeStyle = '#4a2a2a';
    ctx.beginPath();
    ctx.moveTo(cx - 11, cy - 20); ctx.lineTo(cx - 6, cy - 20);
    ctx.moveTo(cx + 5, cy - 20); ctx.lineTo(cx + 10, cy - 20);
    ctx.stroke();
  }

  // Aura kaya
  if (state.money > 120) {
    ctx.strokeStyle = `rgba(255,215,0,${0.3 + Math.sin(state.frame * 0.08) * 0.2})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 55 + Math.sin(state.frame * 0.1) * 3, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ============================================================
//  PARTICLES
// ============================================================
function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    state.particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.8) * 6,
      size: 2 + Math.random() * 3,
      color, life: 1
    });
  }
}

function addFloatingText(text, color) {
  state.floatingTexts.push({
    x: W / 2, y: H / 2 - 40,
    text, color, life: 1, vy: -1
  });
}

function drawParticles() {
  state.particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  state.particles = state.particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.3;
    p.life -= 0.025;
    return p.life > 0;
  });
}

function drawFloatingTexts() {
  ctx.textAlign = 'center';
  state.floatingTexts.forEach(t => {
    ctx.globalAlpha = t.life;
    ctx.font = 'bold 18px Courier New';
    ctx.fillStyle = t.color;
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 15;
    ctx.fillText(t.text, t.x, t.y);
    ctx.shadowBlur = 0;
    t.y += t.vy;
    t.life -= 0.015;
  });
  ctx.globalAlpha = 1;
  state.floatingTexts = state.floatingTexts.filter(t => t.life > 0);
}

// ============================================================
//  GAME LOOP
// ============================================================
function update() {
  if (!state.running || state.paused) return;
  state.frame++;
  state.bgOffset += 2;

  if (state.age >= state.nextChoiceAge && !state.endingTriggered) {
    showChoice();
    return;
  }

  // Cek game over
  if (state.health <= 0) return gameOver('💔 KESEHATAN HABIS', 'Tubuhmu menyerah sebelum nasib berubah.');
  if (state.stress >= 100) return gameOver('🧠 STRES BERLEBIHAN', 'Pikiranmu kacau, butuh istirahat panjang.');
  if (state.money <= -50) return gameOver('💸 BANGKRUT', 'Tidak ada uang, tidak ada masa depan.');
  if (state.score >= 500) return gameOver('🏆 NASIB BERUBAH!', 'Kamu berhasil mengubah nasibmu sendiri!');
}

function draw() {
  drawBackground();
  if (state.running || state.paused) drawCharacter();
  drawParticles();
  drawFloatingTexts();

  if (state.stress > 70) {
    ctx.fillStyle = `rgba(255,0,0,${0.05 + Math.sin(state.frame * 0.3) * 0.03})`;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.textAlign = 'right';
  ctx.font = 'bold 14px Courier New';
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 10;
  ctx.fillText(`SKOR NASIB: ${state.score}/500`, W - 15, 22);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
//  PILIHAN KARIER
// ============================================================
let currentChoices = [];

function getChoicesForPlayer() {
  let pool = [...CAREER_CHOICES_BASE];
  // Tambah pilihan khusus status
  if (SPECIAL_CHOICES[player.status]) {
    pool = pool.concat(SPECIAL_CHOICES[player.status]);
  }

  // Filter berdasarkan kondisi
  if (state.money < 20) {
    pool = pool.filter(c => c.effects.money >= 0 || c.effects.money > -15);
  }
  if (state.health < 40) {
    // Hindari pilihan yang mengurangi banyak health
    pool = pool.filter(c => c.effects.health >= -10);
  }

  return pool.sort(() => Math.random() - 0.5).slice(0, 3);
}

function showChoice() {
  state.paused = true;
  document.getElementById('choiceModal').classList.add('show');
  currentChoices = getChoicesForPlayer();

  document.getElementById('choiceTitle').textContent = `📅 UMUR ${state.age} — PILIHAN NASIB`;
  document.getElementById('choiceSub').textContent = `${player.name}, pilihanmu menentukan arah hidup...`;

  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  currentChoices.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.innerHTML = `
      <div class="title">${c.title}</div>
      <div class="desc">${c.desc}</div>
      <div class="outcome">⚡ ${c.paradox}</div>
    `;
    div.onclick = () => applyChoice(i);
    box.appendChild(div);
  });
}

function applyChoice(index) {
  const choice = currentChoices[index];
  document.getElementById('choiceModal').classList.remove('show');

  // Efek
  let bonusMoney = 0;
  if (player.status === 'pekerja') bonusMoney = 10; // gaji stabil
  if (player.status === 'pengusaha' && choice.effects.money > 0) bonusMoney = Math.round(choice.effects.money * 0.2);
  
  state.money += choice.effects.money + bonusMoney;
  state.health += choice.effects.health;
  state.stress += choice.effects.stress;
  state.rep += choice.effects.rep;
  state.score += choice.score;

  // Clamp
  state.money = Math.max(-50, state.money);
  state.health = Math.min(100, Math.max(0, state.health));
  state.stress = Math.min(100, Math.max(0, state.stress));
  state.rep = Math.min(100, Math.max(0, state.rep));

  // Efek visual
  const total = choice.effects.money + choice.effects.health + choice.effects.rep - choice.effects.stress;
  const color = total >= 0 ? '#4ecdc4' : '#ff6b6b';
  addParticles(W / 2, H / 2, color, 25);
  addFloatingText(`+${choice.score} SKOR`, '#ffd700');
  if (bonusMoney > 0) addFloatingText(`+${bonusMoney} bonus gaji`, '#00ff88');

  const shake = Math.min(12, Math.abs(total) * 0.5);
  canvas.style.transform = `translate(${(Math.random() - 0.5) * shake}px, ${(Math.random() - 0.5) * shake}px)`;
  setTimeout(() => canvas.style.transform = 'translate(0,0)', 150);

  // Umur berikutnya: +2 s.d +4 tahun
  const ageStep = 2 + Math.floor(Math.random() * 3);
  state.age += ageStep;
  state.nextChoiceAge = state.age + 2;

  // Cek pensiun (60)
  if (state.age >= 60) {
    return gameOver('🎉 PENSIUN', 'Perjalanan kariermu berakhir. Nasib telah tertulis.');
  }

  updateHUD();
  state.paused = false;
}

// ============================================================
//  END GAME
// ============================================================
function gameOver(title, msg) {
  state.running = false;
  state.endingTriggered = true;

  let rating;
  if (state.score >= 500) rating = '🌟 LEGENDA — Nasibmu berubah total!';
  else if (state.score >= 350) rating = '💫 SUKSES — Hidupmu lebih baik dari kebanyakan orang.';
  else if (state.score >= 200) rating = '👍 CUKUP — Setidaknya kau bertahan.';
  else if (state.score >= 100) rating = '😅 PAS-PASAN — Hidup keras, tapi jalan terus.';
  else rating = '😔 TRAGIS — Nasib tidak berpihak padamu.';

  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = msg;
  document.getElementById('endScore').textContent = `SKOR NASIB: ${state.score}/500`;
  document.getElementById('endRating').textContent = rating;
  document.getElementById('endStats').innerHTML = `
    <p><b>📊 STATISTIK AKHIR ${player.name.toUpperCase()}:</b></p>
    <p>Status Awal: ${STATUSES.find(s => s.id === player.status).icon} ${STATUSES.find(s => s.id === player.status).name}</p>
    <p>💰 Uang: ${Math.round(state.money)} | ❤️ Kesehatan: ${Math.round(state.health)}%</p>
    <p>🧠 Stres: ${Math.round(state.stress)}% | ⭐ Reputasi: ${Math.round(state.rep)}</p>
    <p>📅 Umur: ${state.age} tahun</p>
  `;
  document.getElementById('endQuote').textContent = '"Nasib bukan takdir — ia adalah akumulasi dari pilihan kecil yang kita buat setiap hari."';

  showScreen('screenEnd');
}

function resetToCreate() {
  state.running = false;
  state.paused = false;
  selectedStatus = null;
  document.getElementById('inputName').value = '';
  document.getElementById('inputAge').value = 22;
  document.getElementById('btnStart').disabled = true;
  document.querySelectorAll('.status-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.gender-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
  selectedGender = 'Laki-laki';
  document.getElementById('playerTag').classList.remove('show');
  canvas.style.borderColor = '#ffd700';
  document.getElementById('hud').style.borderColor = '#ffd700';
  showScreen('screenCreate');
}

// ============================================================
//  RUN
// ============================================================
state.running = false;
loop();
</script>
