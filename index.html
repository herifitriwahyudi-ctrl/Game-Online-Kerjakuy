<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFD700">
    <link rel="manifest" href="manifest.json">
    <title>🍎 Fruit Crush Special 🍊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            padding: 10px;
        }
        .game-container {
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.6), 0 0 0 3px rgba(255, 215, 0, 0.3);
            max-width: 720px;
            width: 100%;
            position: relative;
        }
        .header { text-align: center; margin-bottom: 8px; }
        h1 {
            color: #333;
            font-size: 1.7em;
            margin-bottom: 2px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        .subtitle { color: #888; font-size: 0.75em; }

        .top-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 0.6fr;
            gap: 6px;
            margin-bottom: 8px;
        }
        .saldo-box {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 12px;
            padding: 8px 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4), inset 0 0 15px rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .saldo-label {
            font-size: 0.6em;
            color: #4a2800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .saldo-value {
            font-size: 1.2em;
            font-weight: 900;
            color: #333;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }
        .action-btn {
            border: none;
            border-radius: 12px;
            padding: 8px 5px;
            font-size: 0.75em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            letter-spacing: 0.5px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
        .action-btn .icon { font-size: 1.3em; }
        .action-btn .label { font-size: 0.85em; text-transform: uppercase; }
        .btn-topup { background: linear-gradient(135deg, #00b894 0%, #00a085 100%); }
        .btn-withdraw { background: linear-gradient(135deg, #e17055 0%, #c0392b 100%); }
        .btn-logout { background: linear-gradient(135deg, #666 0%, #444 100%); }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            border-radius: 15px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.1);
            cursor: pointer;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        .bet-panel {
            margin-top: 10px;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            border-radius: 15px;
            padding: 10px 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4), inset 0 0 20px rgba(0, 200, 255, 0.1);
            border: 2px solid rgba(0, 200, 255, 0.3);
        }
        .bet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: white; }
        .bet-title {
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #00D4FF;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
            letter-spacing: 1px;
        }
        .bet-controls-top { display: flex; align-items: center; gap: 6px; }
        .bet-control-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.7em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .bet-control-btn:hover { background: rgba(0, 212, 255, 0.3); border-color: #00D4FF; }
        .bet-main { display: flex; align-items: center; gap: 8px; }
        .bet-display {
            flex: 1;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d4a 100%);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        .bet-display-label {
            font-size: 0.6em;
            color: #00D4FF;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.9;
        }
        .bet-display-value {
            font-size: 1.4em;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .bet-arrow {
            background: linear-gradient(135deg, #00D4FF 0%, #0099CC 100%);
            color: white;
            border: none;
            border-radius: 12px;
            width: 46px;
            height: 46px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        .bet-arrow:hover:not(:disabled) { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 20px rgba(0, 212, 255, 0.7); }
        .bet-arrow:disabled { opacity: 0.4; cursor: not-allowed; background: linear-gradient(135deg, #666 0%, #444 100%); }
        .bet-arrow.down { background: linear-gradient(135deg, #f5576c 0%, #c72c41 100%); box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4); }
        .bet-quick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px; }
        .bet-quick-btn {
            background: linear-gradient(135deg, #2d2d4a 0%, #1a1a2e 100%);
            color: #00D4FF;
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 8px;
            padding: 6px 2px;
            font-size: 0.7em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .bet-quick-btn:hover { background: linear-gradient(135deg, #00D4FF 0%, #0099CC 100%); color: white; transform: translateY(-2px); }
        .bet-quick-btn.active {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #333;
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            transform: scale(1.05);
        }

        .autospin-panel {
            margin-top: 8px;
            background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .autospin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: white; }
        .autospin-title { font-size: 0.85em; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .autospin-status {
            font-size: 0.7em;
            background: rgba(255,255,255,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .autospin-status.active {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #333;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(132, 250, 176, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(132, 250, 176, 0); }
        }
        .autospin-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .spin-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: 2px solid transparent;
            padding: 6px 3px;
            font-size: 0.75em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            position: relative;
            overflow: hidden;
        }
        .spin-btn .spin-count { font-size: 0.95em; }
        .spin-btn .spin-label { font-size: 0.5em; opacity: 0.9; text-transform: uppercase; }
        .spin-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .spin-btn.selected { border-color: #FFD700; box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.5); }
        .spin-btn.spinning {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            animation: spinPulse 0.8s infinite;
        }
        @keyframes spinPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
        }
        .spin-btn .spin-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #FFD700;
            width: 0%;
            transition: width 0.3s;
        }
        .spin-btn.unlimited { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); color: #333; }
        .autospin-controls { display: flex; gap: 6px; margin-top: 8px; }
        .autospin-controls button {
            flex: 1;
            padding: 8px;
            font-size: 0.8em;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-stop { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: #333; }
        .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }

        .drop-warning {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #FFD700, #FF66FF);
            color: #333;
            text-align: center;
            padding: 6px;
            font-weight: bold;
            font-size: 0.85em;
            z-index: 60;
            border-radius: 25px 25px 0 0;
            animation: slideDown 0.4s ease;
            display: none;
        }
        .drop-warning.show { display: block; }
        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 2.8em;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 100, 0, 0.6);
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            white-space: nowrap;
        }
        .combo-display.pop { animation: comboPop 1s ease-out; }
        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.3em; }
            .saldo-value { font-size: 1em; }
            .action-btn { font-size: 0.65em; padding: 6px 3px; }
            .action-btn .icon { font-size: 1.1em; }
            .spin-btn { font-size: 0.65em; padding: 5px 2px; }
            .combo-display { font-size: 1.8em; }
            .bet-display-value { font-size: 1.1em; }
            .bet-arrow { width: 40px; height: 40px; font-size: 1.3em; }
            .bet-quick-btn { font-size: 0.6em; padding: 5px 1px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="drop-warning" id="dropWarning">⚠️ BUAH SPESIAL TURUN! TANGKAP SEKARANG! ⚠️</div>

        <div class="header">
            <h1>🍎 Fruit Crush Special 🍊</h1>
            <div class="subtitle">Match 3 • Buah Spesial Turun • Tangkap!</div>
        </div>

        <div class="top-row">
            <div class="saldo-box">
                <div class="saldo-label">💰 Saldo</div>
                <div class="saldo-value" id="balance">0</div>
            </div>
            <button class="action-btn btn-topup" onclick="openTopup()">
                <span class="icon">📥</span>
                <span class="label">Top Up</span>
            </button>
            <button class="action-btn btn-withdraw" onclick="openWithdraw()">
                <span class="icon">📤</span>
                <span class="label">Tarik</span>
            </button>
            <button class="action-btn btn-logout" onclick="doLogout()">
                <span class="icon">🚪</span>
                <span class="label">Keluar</span>
            </button>
        </div>

        <canvas id="gameCanvas" width="480" height="480"></canvas>

        <div class="bet-panel">
            <div class="bet-header">
                <div class="bet-title">💎 BET SYSTEM</div>
                <div class="bet-controls-top">
                    <button class="bet-control-btn" onclick="setBetMin()">MIN</button>
                    <button class="bet-control-btn" onclick="setBetMax()">MAX</button>
                </div>
            </div>
            <div class="bet-main">
                <button class="bet-arrow down" id="betDown" onclick="decreaseBet()">▼</button>
                <div class="bet-display">
                    <div class="bet-display-label">BET PER SPIN</div>
                    <div class="bet-display-value" id="betDisplay">100</div>
                </div>
                <button class="bet-arrow" id="betUp" onclick="increaseBet()">▲</button>
            </div>
            <div class="bet-quick" id="betQuick">
                <button class="bet-quick-btn" data-bet="100" onclick="setBet(100)">100</button>
                <button class="bet-quick-btn" data-bet="500" onclick="setBet(500)">500</button>
                <button class="bet-quick-btn" data-bet="1000" onclick="setBet(1000)">1K</button>
                <button class="bet-quick-btn" data-bet="2000" onclick="setBet(2000)">2K</button>
                <button class="bet-quick-btn" data-bet="5000" onclick="setBet(5000)">5K</button>
                <button class="bet-quick-btn" data-bet="10000" onclick="setBet(10000)">10K</button>
            </div>
        </div>

        <div class="autospin-panel">
            <div class="autospin-header">
                <div class="autospin-title">🎰 AUTO SPIN</div>
                <div class="autospin-status" id="autospinStatus">OFF</div>
            </div>
            <div class="autospin-options">
                <button class="spin-btn" data-spins="10" onclick="selectAutoSpin(10)">
                    <span class="spin-count">10x</span>
                    <span class="spin-label">Spin</span>
                    <div class="spin-progress"></div>
                </button>
                <button class="spin-btn" data-spins="30" onclick="selectAutoSpin(30)">
                    <span class="spin-count">30x</span>
                    <span class="spin-label">Spin</span>
                    <div class="spin-progress"></div>
                </button>
                <button class="spin-btn" data-spins="50" onclick="selectAutoSpin(50)">
                    <span class="spin-count">50x</span>
                    <span class="spin-label">Spin</span>
                    <div class="spin-progress"></div>
                </button>
                <button class="spin-btn" data-spins="100" onclick="selectAutoSpin(100)">
                    <span class="spin-count">100x</span>
                    <span class="spin-label">Spin</span>
                    <div class="spin-progress"></div>
                </button>
                <button class="spin-btn" data-spins="200" onclick="selectAutoSpin(200)">
                    <span class="spin-count">200x</span>
                    <span class="spin-label">Spin</span>
                    <div class="spin-progress"></div>
                </button>
                <button class="spin-btn" data-spins="500" onclick="selectAutoSpin(500)">
                    <span class="spin-count">500x</span>
                    <span class="spin-label">Spin</span>
                    <div class="spin-progress"></div>
                </button>
                <button class="spin-btn" data-spins="1000" onclick="selectAutoSpin(1000)">
                    <span class="spin-count">1000x</span>
                    <span class="spin-label">Spin</span>
                    <div class="spin-progress"></div>
                </button>
                <button class="spin-btn unlimited" data-spins="999999" onclick="selectAutoSpin(999999)">
                    <span class="spin-count">∞</span>
                    <span class="spin-label">Unlimited</span>
                    <div class="spin-progress"></div>
                </button>
            </div>
            <div class="autospin-controls">
                <button class="btn-stop" id="stopBtn" onclick="stopAutoSpin()" disabled>⏹ STOP AUTO SPIN</button>
            </div>
        </div>

        <div class="combo-display" id="comboDisplay">COMBO!</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const ROWS = 8;
        const COLS = 8;
        const TILE_SIZE = canvas.width / COLS;

        const FRUIT_TYPES = [
            { emoji: '🍎', color: '#ff4444', name: 'Apel' },
            { emoji: '🍊', color: '#ff8800', name: 'Jeruk' },
            { emoji: '🍇', color: '#9944ff', name: 'Anggur' },
            { emoji: '🍋', color: '#ffdd00', name: 'Lemon' },
            { emoji: '🍓', color: '#ff2266', name: 'Strawberry' },
            { emoji: '🥝', color: '#88cc00', name: 'Kiwi' }
        ];

        const BET_LEVELS = [100, 500, 1000, 2000, 5000, 10000];

        const SPECIAL_CONFIG = {
            gold:    { mult: 50,  icon: '🍋', name: 'Buah Emas',  color: '#FFD700', weight: 0.5 },
            bomb:    { mult: 100, icon: '💣', name: 'Bom Buah',   color: '#ff3c3c', weight: 0.3 },
            thunder: { mult: 300, icon: '⚡', name: 'Buah Petir', color: '#00D4FF', weight: 0.2 }
        };

        const DROP_PROBABILITY = 0.10;

        // ===== STATE =====
        let currentUser = null;         // Firebase Auth user
        let currentUserData = null;     // Data user dari Firestore
        let unsubscribeUser = null;     // Listener onSnapshot
        let authUnsubscribe = null;     // Listener auth state

        let bet = { current: 100, index: 0 };

        let game = {
            board: [],
            balance: 0,
            selected: null,
            isAnimating: false,
            particles: [],
            floatingTexts: [],
            hintTile: null,
            hintTimer: 0
        };

        let special = {
            active: false,
            type: null,
            multiplier: 0,
            spinsLeft: 0,
            totalSpins: 0
        };

        let droppingFruit = null;
        let dropIdCounter = 0;

        let autoSpin = {
            active: false,
            selected: 0,
            remaining: 0,
            total: 0,
            spinCount: 0,
            isUnlimited: false,
            timeoutId: null,
            delayMs: 350
        };

        // ===== HELPERS =====
        function getActiveUid() {
            return FB.auth.currentUser ? FB.auth.currentUser.uid : null;
        }

        function isCorrectUser(uid) {
            const activeUid = getActiveUid();
            return activeUid && activeUid === uid;
        }

        // ===== LOGOUT =====
        async function doLogout() {
            if (!confirm('Keluar dari akun?')) return;
            if (unsubscribeUser) { unsubscribeUser(); unsubscribeUser = null; }
            if (authUnsubscribe) { authUnsubscribe(); authUnsubscribe = null; }
            await FB.logout();
        }

        function updateBalanceUI() {
            document.getElementById('balance').textContent = game.balance.toLocaleString('id-ID');
        }

        // ===== BALANCE =====
        async function deductBalance(amount) {
            const uid = getActiveUid();
            if (!uid) return;

            // Optimistic UI
            game.balance -= amount;
            if (game.balance < 0) game.balance = 0;
            updateBalanceUI();

            try {
                await FB.updateBalance(uid, -amount);
            } catch (e) {
                console.error('deductBalance error:', e);
                // Rollback
                game.balance += amount;
                updateBalanceUI();
            }
        }

        async function addBalance(amount) {
            const uid = getActiveUid();
            if (!uid) return;

            game.balance += amount;
            updateBalanceUI();

            try {
                await FB.updateBalance(uid, amount);
            } catch (e) {
                console.error('addBalance error:', e);
                game.balance -= amount;
                updateBalanceUI();
            }
        }

        async function logTransaction(type, amount, note) {
            const uid = getActiveUid();
            if (!uid || !currentUserData) return;
            try {
                await FB.logTransaction({
                    uid,
                    username: currentUserData.username,
                    type,
                    amount,
                    note
                });
            } catch (e) {
                console.error('logTransaction error:', e);
            }
        }

        // ===== NAVIGATION =====
        function openTopup() {
            if (game.isAnimating || autoSpin.active) return;
            window.location.href = 'pembayaran.html?mode=topup';
        }

        function openWithdraw() {
            if (game.isAnimating || autoSpin.active) return;
            window.location.href = 'pembayaran.html?mode=withdraw';
        }

        // ===== DROP =====
        function showDropWarning(text) {
            const el = document.getElementById('dropWarning');
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 2500);
        }

        function rollSpecialDrop() {
            if (droppingFruit) return;
            if (special.active) return;

            const r = Math.random();
            if (r >= DROP_PROBABILITY) return;

            const types = ['gold', 'bomb', 'thunder'];
            const weights = types.map(t => SPECIAL_CONFIG[t].weight);
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            const roll = Math.random() * totalWeight;
            let acc = 0;
            let chosen = types[0];
            for (let i = 0; i < types.length; i++) {
                acc += weights[i];
                if (roll <= acc) { chosen = types[i]; break; }
            }

            const cfg = SPECIAL_CONFIG[chosen];
            const targetCol = Math.floor(Math.random() * COLS);
            const targetX = targetCol * TILE_SIZE + TILE_SIZE / 2;

            droppingFruit = {
                id: ++dropIdCounter,
                type: chosen,
                x: targetX,
                y: -TILE_SIZE,
                targetY: canvas.height * 0.4 + Math.random() * canvas.height * 0.3,
                speed: 1.8,
                caught: false,
                life: 1,
                wobble: Math.random() * Math.PI * 2,
                size: TILE_SIZE * 0.85
            };

            showDropWarning(`${cfg.icon} ${cfg.name} (${cfg.mult}x) TURUN! TANGKAP!`);
        }

        function catchDroppingFruit() {
            if (!droppingFruit || droppingFruit.caught) return;
            droppingFruit.caught = true;

            const cfg = SPECIAL_CONFIG[droppingFruit.type];
            const mult = cfg.mult;

            if (special.active) endSpecial();

            special.active = true;
            special.type = droppingFruit.type;
            special.multiplier = mult;
            special.totalSpins = 10;
            special.spinsLeft = special.totalSpins;

            showComboDisplay(`${cfg.icon} ${cfg.name} ${mult}x!`);
            createFloatingText(canvas.width / 2, canvas.height / 2, `${cfg.icon} ${mult}x AKTIF!`, cfg.color, 44);

            const colors = droppingFruit.type === 'gold'
                ? ['#FFD700', '#FFA500', '#FFEC8B']
                : (droppingFruit.type === 'bomb'
                    ? ['#ff3c3c', '#8b0000', '#ff6666']
                    : ['#00D4FF', '#0066ff', '#88ddff']);

            for (let i = 0; i < 60; i++) {
                game.particles.push({
                    x: droppingFruit.x, y: droppingFruit.y,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16,
                    life: 1, decay: 0.015,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4
                });
            }

            droppingFruit = null;
        }

        function missDroppingFruit() {
            if (!droppingFruit) return;
            const cfg = SPECIAL_CONFIG[droppingFruit.type];
            createFloatingText(droppingFruit.x, droppingFruit.y, `❌ ${cfg.icon} HILANG!`, '#ff6666', 28);
            droppingFruit = null;
        }

        function updateDroppingFruit() {
            if (!droppingFruit) return;
            if (droppingFruit.caught) { droppingFruit = null; return; }

            droppingFruit.y += droppingFruit.speed;
            droppingFruit.wobble += 0.1;

            if (droppingFruit.y >= droppingFruit.targetY) {
                droppingFruit.life -= 0.008;
                if (droppingFruit.life <= 0) { missDroppingFruit(); return; }
            }
            if (droppingFruit.y > canvas.height + 50) missDroppingFruit();
        }

        function drawDroppingFruit() {
            if (!droppingFruit) return;
            const f = droppingFruit;
            const cfg = SPECIAL_CONFIG[f.type];
            const wobbleX = Math.sin(f.wobble) * 6;

            ctx.save();
            const gradient = ctx.createRadialGradient(f.x + wobbleX, f.y, 0, f.x + wobbleX, f.y, f.size);
            gradient.addColorStop(0, cfg.color);
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.3)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.globalAlpha = f.life;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(f.x + wobbleX, f.y, f.size, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = cfg.color;
            ctx.lineWidth = 3;
            ctx.globalAlpha = f.life * (0.5 + Math.sin(Date.now() / 150) * 0.5);
            ctx.beginPath();
            ctx.arc(f.x + wobbleX, f.y, f.size * 0.9, 0, Math.PI * 2);
            ctx.stroke();

            ctx.globalAlpha = f.life;
            ctx.font = `${f.size * 0.9}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = cfg.color;
            ctx.shadowBlur = 20;
            ctx.fillText(cfg.icon, f.x + wobbleX, f.y);

            ctx.shadowBlur = 10;
            ctx.font = `bold ${f.size * 0.35}px Arial`;
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            ctx.strokeText(`${cfg.mult}x`, f.x + wobbleX, f.y + f.size * 0.7);
            ctx.fillText(`${cfg.mult}x`, f.x + wobbleX, f.y + f.size * 0.7);
            ctx.restore();
        }

        function checkDropClick(mx, my) {
            if (!droppingFruit) return false;
            const f = droppingFruit;
            const wobbleX = Math.sin(f.wobble) * 6;
            const dx = mx - (f.x + wobbleX);
            const dy = my - f.y;
            if (Math.sqrt(dx * dx + dy * dy) < f.size) {
                catchDroppingFruit();
                return true;
            }
            return false;
        }

        // ===== BET =====
        function updateBetUI() {
            document.getElementById('betDisplay').textContent = bet.current.toLocaleString('id-ID');
            document.getElementById('betDown').disabled = bet.index === 0;
            document.getElementById('betUp').disabled = bet.index === BET_LEVELS.length - 1;
            document.querySelectorAll('.bet-quick-btn').forEach(b => {
                b.classList.toggle('active', parseInt(b.dataset.bet) === bet.current);
            });
        }

        function increaseBet() {
            if (game.isAnimating || autoSpin.active) return;
            if (bet.index < BET_LEVELS.length - 1) {
                bet.index++;
                bet.current = BET_LEVELS[bet.index];
                updateBetUI();
            }
        }

        function decreaseBet() {
            if (game.isAnimating || autoSpin.active) return;
            if (bet.index > 0) {
                bet.index--;
                bet.current = BET_LEVELS[bet.index];
                updateBetUI();
            }
        }

        function setBet(amount) {
            if (game.isAnimating || autoSpin.active) return;
            const idx = BET_LEVELS.indexOf(amount);
            if (idx >= 0) {
                bet.index = idx;
                bet.current = amount;
                updateBetUI();
            }
        }

        function setBetMin() { if (!game.isAnimating && !autoSpin.active) setBet(BET_LEVELS[0]); }
        function setBetMax() { if (!game.isAnimating && !autoSpin.active) setBet(BET_LEVELS[BET_LEVELS.length - 1]); }

        // ===== BOARD =====
        function initBoard() {
            game.board = [];
            for (let r = 0; r < ROWS; r++) {
                game.board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    let type, attempts = 0;
                    do {
                        type = Math.floor(Math.random() * FRUIT_TYPES.length);
                        attempts++;
                    } while (wouldMatch(r, c, type) && attempts < 50);
                    game.board[r][c] = type;
                }
            }
            if (!findHint()) autoShuffleIfStuck();
        }

        function wouldMatch(row, col, type) {
            if (col >= 2 && game.board[row][col-1] === type && game.board[row][col-2] === type) return true;
            if (row >= 2 && game.board[row-1][col] === type && game.board[row-2][col] === type) return true;
            return false;
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? '#fff5e6' : '#ffe8cc';
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const type = game.board[r][c];
                    if (type === null || type === undefined) continue;
                    const x = c * TILE_SIZE + TILE_SIZE / 2;
                    const y = r * TILE_SIZE + TILE_SIZE / 2;

                    if (game.selected && game.selected.r === r && game.selected.c === c) {
                        ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
                        ctx.beginPath();
                        ctx.arc(x, y, TILE_SIZE * 0.48, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#FFD700';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }

                    if (game.hintTile && game.hintTile.r === r && game.hintTile.c === c) {
                        const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
                        ctx.fillStyle = `rgba(132, 250, 176, ${pulse * 0.5})`;
                        ctx.beginPath();
                        ctx.arc(x, y, TILE_SIZE * 0.45, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.save();
                    ctx.font = `${TILE_SIZE * 0.7}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,0.15)';
                    ctx.shadowBlur = 5;
                    ctx.shadowOffsetY = 2;
                    ctx.fillText(FRUIT_TYPES[type].emoji, x, y);
                    ctx.restore();
                }
            }

            game.particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            game.floatingTexts.forEach(t => {
                ctx.globalAlpha = t.life;
                ctx.fillStyle = t.color;
                ctx.font = `bold ${t.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.strokeText(t.text, t.x, t.y);
                ctx.fillText(t.text, t.x, t.y);
                ctx.globalAlpha = 1;
            });

            if (autoSpin.active) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
                ctx.lineWidth = 4;
                ctx.setLineDash([15, 10]);
                ctx.lineDashOffset = -Date.now() / 30;
                ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
                ctx.restore();
            }

            drawDroppingFruit();

            if (special.active) {
                let borderColor, overlayIcon, overlayColor;
                if (special.type === 'gold') {
                    borderColor = 'rgba(255, 215, 0, 0.9)';
                    overlayIcon = '🍋';
                    overlayColor = 'rgba(255, 215, 0, 0.15)';
                } else if (special.type === 'bomb') {
                    borderColor = 'rgba(255, 60, 60, 0.9)';
                    overlayIcon = '💣';
                    overlayColor = 'rgba(255, 60, 60, 0.12)';
                } else {
                    borderColor = 'rgba(100, 200, 255, 0.9)';
                    overlayIcon = '⚡';
                    overlayColor = 'rgba(100, 200, 255, 0.12)';
                }

                ctx.save();
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 5;
                ctx.setLineDash([20, 8]);
                ctx.lineDashOffset = Date.now() / 25;
                ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);
                ctx.restore();

                ctx.save();
                ctx.font = `bold ${TILE_SIZE * 1.3}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = overlayColor;
                ctx.fillText(overlayIcon, canvas.width / 2, canvas.height / 2);
                ctx.font = `bold ${TILE_SIZE * 0.9}px Arial`;
                ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + Math.sin(Date.now()/200) * 0.3})`;
                ctx.fillText(`${special.multiplier}x`, canvas.width / 2, canvas.height / 2 + TILE_SIZE * 1.5);
                ctx.restore();
            }

            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(5, 5, 130, 22);
            ctx.fillStyle = '#00D4FF';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(`💰 BET: ${bet.current.toLocaleString('id-ID')}`, 10, 16);
            ctx.restore();
        }

        // ===== MATCH =====
        function findMatches() {
            const matches = new Set();

            for (let r = 0; r < ROWS; r++) {
                let count = 1;
                for (let c = 1; c <= COLS; c++) {
                    if (c < COLS && game.board[r][c] !== null && game.board[r][c] === game.board[r][c-1]) {
                        count++;
                    } else {
                        if (count >= 3 && game.board[r][c-1] !== null) {
                            for (let k = c - count; k < c; k++) matches.add(`${r},${k}`);
                        }
                        count = 1;
                    }
                }
            }

            for (let c = 0; c < COLS; c++) {
                let count = 1;
                for (let r = 1; r <= ROWS; r++) {
                    if (r < ROWS && game.board[r][c] !== null && game.board[r][c] === game.board[r-1][c]) {
                        count++;
                    } else {
                        if (count >= 3 && game.board[r-1][c] !== null) {
                            for (let k = r - count; k < r; k++) matches.add(`${k},${c}`);
                        }
                        count = 1;
                    }
                }
            }
            return matches;
        }

        function swapTiles(r1, c1, r2, c2) {
            const temp = game.board[r1][c1];
            game.board[r1][c1] = game.board[r2][c2];
            game.board[r2][c2] = temp;
        }

        function isValidSwap(r1, c1, r2, c2) {
            swapTiles(r1, c1, r2, c2);
            const matches = findMatches();
            swapTiles(r1, c1, r2, c2);
            return matches.size > 0;
        }

        function autoShuffleIfStuck() {
            const allFruits = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (game.board[r][c] !== null) allFruits.push(game.board[r][c]);
                }
            }
            for (let i = allFruits.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allFruits[i], allFruits[j]] = [allFruits[j], allFruits[i]];
            }
            let idx = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (game.board[r][c] !== null) game.board[r][c] = allFruits[idx++];
                }
            }

            let attempts = 0;
            let matches = findMatches();
            let hint = findHint();
            while ((matches.size > 0 || !hint) && attempts < 100) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (game.board[r][c] !== null) {
                            game.board[r][c] = Math.floor(Math.random() * FRUIT_TYPES.length);
                        }
                    }
                }
                matches = findMatches();
                hint = findHint();
                attempts++;
            }
            if (matches.size > 0 || !hint) { initBoard(); return; }
            game.selected = null;
            game.hintTile = null;
        }

        function applySpecialEffect() {
            if (!special.active) return;
            const effectColors = {
                gold: ['#FFD700', '#FFA500', '#FFEC8B'],
                bomb: ['#ff3c3c', '#8b0000', '#ff6666'],
                thunder: ['#00D4FF', '#0066ff', '#88ddff']
            };
            const colors = effectColors[special.type] || ['#FFD700'];

            for (let i = 0; i < 30; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const edge = Math.floor(Math.random() * 4);
                let x, y;
                if (edge === 0) { x = Math.random() * canvas.width; y = 5; }
                else if (edge === 1) { x = canvas.width - 5; y = Math.random() * canvas.height; }
                else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height - 5; }
                else { x = 5; y = Math.random() * canvas.height; }
                game.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1, decay: 0.02, color,
                    size: Math.random() * 6 + 3
                });
            }
        }

        // ===== CASCADE =====
        async function processMatches(isInitial = false) {
            let totalCascade = 0;
            let totalWon = 0;

            while (true) {
                const matches = findMatches();
                if (matches.size === 0) break;

                totalCascade++;
                const matchCount = matches.size;
                const baseScore = 10;
                const sizeBonus = matchCount > 3 ? (matchCount - 3) * 10 : 0;
                const cascadeMultiplier = 1 + (totalCascade - 1) * 0.5;
                const specialMultiplier = special.active ? special.multiplier : 1;
                const basePoints = Math.floor((baseScore * matchCount + sizeBonus) * cascadeMultiplier * specialMultiplier);
                const betMultiplier = bet.current / 100;
                const points = Math.floor(basePoints * betMultiplier);

                if (!isInitial || totalCascade > 1) totalWon += points;

                matches.forEach(pos => {
                    const [r, c] = pos.split(',').map(Number);
                    const type = game.board[r][c];
                    if (type === null) return;
                    const x = c * TILE_SIZE + TILE_SIZE / 2;
                    const y = r * TILE_SIZE + TILE_SIZE / 2;
                    createParticles(x, y, FRUIT_TYPES[type].color, 6);
                    game.board[r][c] = null;
                });

                if (matches.size > 0) {
                    const positions = [...matches].map(p => p.split(',').map(Number));
                    const avgR = positions.reduce((s, p) => s + p[0], 0) / positions.length;
                    const avgC = positions.reduce((s, p) => s + p[1], 0) / positions.length;
                    let text = `+${points.toLocaleString('id-ID')}`;
                    if (special.active) text += ` ${SPECIAL_CONFIG[special.type].icon}x${special.multiplier}`;
                    if (totalCascade > 1) text += ` (C${totalCascade})`;
                    const color = special.active ? SPECIAL_CONFIG[special.type].color : '#333';
                    createFloatingText(avgC * TILE_SIZE + TILE_SIZE / 2, avgR * TILE_SIZE + TILE_SIZE / 2, text, color, 20);
                }

                drawBoard();
                await sleep(220);
                dropTiles();
                drawBoard();
                await sleep(180);
            }

            if (totalWon > 0) {
                await addBalance(totalWon);
                logTransaction('win', totalWon, 'Menang game');
                createFloatingText(canvas.width / 2, 80, `💰 +${totalWon.toLocaleString('id-ID')}`, '#FFD700', 32);
            }

            if (!findHint()) {
                await sleep(300);
                createFloatingText(canvas.width / 2, canvas.height / 2, 'Shuffling...', '#666', 32);
                await sleep(700);
                autoShuffleIfStuck();
            }
        }

        function dropTiles() {
            for (let c = 0; c < COLS; c++) {
                let writeRow = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (game.board[r][c] !== null) {
                        if (writeRow !== r) {
                            game.board[writeRow][c] = game.board[r][c];
                            game.board[r][c] = null;
                        }
                        writeRow--;
                    }
                }
                for (let r = writeRow; r >= 0; r--) {
                    game.board[r][c] = Math.floor(Math.random() * FRUIT_TYPES.length);
                }
            }
        }

        // ===== EFFECTS =====
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                game.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 3,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.02,
                    color,
                    size: Math.random() * 5 + 3
                });
            }
        }

        function createFloatingText(x, y, text, color, size = 24) {
            game.floatingTexts.push({ x, y, text, color, size, life: 1, vy: -2 });
        }

        function showComboDisplay(text) {
            const el = document.getElementById('comboDisplay');
            el.textContent = text;
            el.classList.remove('pop');
            void el.offsetWidth;
            el.classList.add('pop');
        }

        function updateEffects() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4;
                p.life -= p.decay;
                if (p.life <= 0) game.particles.splice(i, 1);
            }
            for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
                const t = game.floatingTexts[i];
                t.y += t.vy;
                t.life -= 0.015;
                if (t.life <= 0) game.floatingTexts.splice(i, 1);
            }
        }

        // ===== INPUT =====
        let pointerDown = null;

        function getTileFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            const c = Math.floor(x / TILE_SIZE);
            const r = Math.floor(y / TILE_SIZE);

            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return { r, c, x, y };
            return null;
        }

        function handleTileSelect(tile) {
            if (game.isAnimating || autoSpin.active || !tile) return;
            if (checkDropClick(tile.x, tile.y)) return;

            game.hintTile = null;
            game.hintTimer = 0;

            if (!game.selected) {
                game.selected = tile;
            } else {
                const s = game.selected;
                if (s.r === tile.r && s.c === tile.c) {
                    game.selected = null;
                    drawBoard();
                    return;
                }
                const isAdjacent = Math.abs(s.r - tile.r) + Math.abs(s.c - tile.c) === 1;
                if (isAdjacent) {
                    attemptSwap(s, tile);
                    game.selected = null;
                } else {
                    game.selected = tile;
                }
            }
            drawBoard();
        }

        async function attemptSwap(a, b) {
            if (game.isAnimating) return;
            game.isAnimating = true;

            if (game.balance < bet.current) {
                createFloatingText(canvas.width / 2, canvas.height / 2, '❌ Saldo tidak cukup!', '#ff0000', 28);
                game.isAnimating = false;
                return;
            }

            if (isValidSwap(a.r, a.c, b.r, b.c)) {
                await deductBalance(bet.current);
                logTransaction('bet', -bet.current, 'Bet game');
                createFloatingText(canvas.width / 2, canvas.height - 40, `-${bet.current.toLocaleString('id-ID')}`, '#F5576C', 24);

                swapTiles(a.r, a.c, b.r, b.c);
                drawBoard();
                await sleep(150);
                await processMatches();
                rollSpecialDrop();

                if (special.active) {
                    applySpecialEffect();
                    special.spinsLeft--;
                    if (special.spinsLeft <= 0) endSpecial();
                }
            } else {
                createFloatingText(
                    ((a.c + b.c) / 2) * TILE_SIZE + TILE_SIZE / 2,
                    ((a.r + b.r) / 2) * TILE_SIZE + TILE_SIZE / 2,
                    '❌', '#ff0000', 32
                );
                swapTiles(a.r, a.c, b.r, b.c);
                drawBoard();
                await sleep(150);
                swapTiles(a.r, a.c, b.r, b.c);
                drawBoard();
            }
            game.isAnimating = false;
        }

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const tile = getTileFromEvent(e);
            if (tile) handleTileSelect(tile);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const tile = getTileFromEvent(e);
            if (tile) {
                pointerDown = { tile, x: e.touches[0].clientX, y: e.touches[0].clientY };
                handleTileSelect(tile);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!pointerDown) return;
            const dx = e.changedTouches[0].clientX - pointerDown.x;
            const dy = e.changedTouches[0].clientY - pointerDown.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 20 && !game.isAnimating && !autoSpin.active) {
                let targetR = pointerDown.tile.r;
                let targetC = pointerDown.tile.c;
                if (Math.abs(dx) > Math.abs(dy)) targetC += dx > 0 ? 1 : -1;
                else targetR += dy > 0 ? 1 : -1;
                if (targetR >= 0 && targetR < ROWS && targetC >= 0 && targetC < COLS) {
                    game.selected = null;
                    attemptSwap(pointerDown.tile, { r: targetR, c: targetC });
                }
            }
            pointerDown = null;
        }, { passive: false });

        function findHint() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (c < COLS - 1 && isValidSwap(r, c, r, c + 1)) return [{ r, c }, { r, c: c + 1 }];
                    if (r < ROWS - 1 && isValidSwap(r, c, r + 1, c)) return [{ r, c }, { r: r + 1, c }];
                }
            }
            return null;
        }

        function endSpecial() {
            if (!special.active) return;
            const cfg = SPECIAL_CONFIG[special.type];
            const mult = special.multiplier;
            special.active = false;
            special.type = null;
            special.multiplier = 0;
            special.spinsLeft = 0;
            special.totalSpins = 0;
            createFloatingText(canvas.width / 2, canvas.height / 2, `${cfg.icon} ${cfg.name} ${mult}x Berakhir`, '#888', 28);
        }

        // ===== AUTO SPIN =====
        function selectAutoSpin(count) {
            if (game.isAnimating) return;
            if (autoSpin.active) { stopAutoSpin(); return; }
            if (game.balance < bet.current) { showComboDisplay('❌ Saldo tidak cukup!'); return; }

            autoSpin.selected = count;
            autoSpin.isUnlimited = count >= 999999;
            autoSpin.total = autoSpin.isUnlimited ? Infinity : count;
            autoSpin.remaining = autoSpin.total;
            autoSpin.active = true;
            autoSpin.spinCount = 0;

            document.querySelectorAll('.spin-btn').forEach(b => {
                b.classList.remove('selected', 'spinning');
                if (parseInt(b.dataset.spins) === count) b.classList.add('selected');
            });

            document.getElementById('autospinStatus').textContent = autoSpin.isUnlimited ? '∞ AUTO' : `${count}x AUTO`;
            document.getElementById('autospinStatus').classList.add('active');
            document.getElementById('stopBtn').disabled = false;

            setTimeout(() => autoSpinTick(), 400);
        }

        function stopAutoSpin() {
            autoSpin.active = false;
            if (autoSpin.timeoutId) { clearTimeout(autoSpin.timeoutId); autoSpin.timeoutId = null; }
            document.querySelectorAll('.spin-btn').forEach(b => {
                b.classList.remove('spinning', 'selected');
                const progress = b.querySelector('.spin-progress');
                if (progress) progress.style.width = '0%';
            });
            document.getElementById('autospinStatus').textContent = 'OFF';
            document.getElementById('autospinStatus').classList.remove('active');
            document.getElementById('stopBtn').disabled = true;
        }

        async function autoSpinTick() {
            if (!autoSpin.active) { stopAutoSpin(); return; }
            if (!autoSpin.isUnlimited && autoSpin.remaining <= 0) {
                stopAutoSpin();
                createFloatingText(canvas.width / 2, canvas.height / 2, '✅ AUTO SELESAI!', '#FFD700', 32);
                return;
            }
            if (game.balance < bet.current) {
                stopAutoSpin();
                createFloatingText(canvas.width / 2, canvas.height / 2, '❌ Saldo Habis!', '#ff0000', 32);
                return;
            }

            const selectedBtn = document.querySelector('.spin-btn.selected');
            if (selectedBtn) selectedBtn.classList.add('spinning');

            const hint = findHint();
            if (!hint) { autoShuffleIfStuck(); await sleep(300); }
            const move = findHint();
            if (!move) { autoSpin.timeoutId = setTimeout(() => autoSpinTick(), 500); return; }

            game.hintTile = null;
            game.selected = null;
            await attemptSwap(move[0], move[1]);

            autoSpin.spinCount++;
            if (!autoSpin.isUnlimited) autoSpin.remaining--;

            if (selectedBtn) {
                selectedBtn.classList.remove('spinning');
                const progress = selectedBtn.querySelector('.spin-progress');
                if (progress) {
                    if (autoSpin.isUnlimited) progress.style.width = '100%';
                    else {
                        const pct = ((autoSpin.total - autoSpin.remaining) / autoSpin.total) * 100;
                        progress.style.width = pct + '%';
                    }
                }
            }

            if (autoSpin.active) autoSpin.timeoutId = setTimeout(() => autoSpinTick(), autoSpin.delayMs);
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        // ===== LOOP =====
        function gameLoop() {
            updateEffects();
            updateDroppingFruit();

            if (!game.isAnimating && !autoSpin.active && !game.selected && !game.hintTile) {
                game.hintTimer++;
                if (game.hintTimer > 300) {
                    const hint = findHint();
                    if (hint) game.hintTile = hint[0];
                    game.hintTimer = 0;
                }
            } else {
                game.hintTimer = 0;
            }
            drawBoard();
            requestAnimationFrame(gameLoop);
        }

        // ===== INIT =====
        (async function init() {
            FB.registerSW();

            const user = await FB.requireAuth('index.html');
            if (!user) return;
            currentUser = user;

            // Ambil data user
            const data = await FB.getUserData(user.uid);
            if (!data) {
                console.error('User data tidak ditemukan');
                await FB.auth.signOut();
                window.location.href = 'login.html';
                return;
            }
            currentUserData = data;
            game.balance = data.balance || 0;

            // ⚠️ Real-time listener dengan validasi UID
            const thisUid = user.uid;
            unsubscribeUser = FB.db.collection('users').doc(thisUid).onSnapshot((doc) => {
                // Cek apakah user sudah berubah (logout/login user lain)
                const activeUid = getActiveUid();
                if (!activeUid || activeUid !== thisUid) {
                    if (unsubscribeUser) { unsubscribeUser(); unsubscribeUser = null; }
                    return;
                }
                if (!doc.exists) return;
                const d = doc.data();
                currentUserData = { uid: thisUid, ...d };
                if (typeof d.balance === 'number' && d.balance !== game.balance) {
                    game.balance = d.balance;
                    updateBalanceUI();
                }
            });

            // ⚠️ Auto-unsubscribe saat auth berubah
            authUnsubscribe = FB.auth.onAuthStateChanged((newUser) => {
                if (!newUser || newUser.uid !== thisUid) {
                    if (unsubscribeUser) { unsubscribeUser(); unsubscribeUser = null; }
                    if (authUnsubscribe) { authUnsubscribe(); authUnsubscribe = null; }
                }
            });

            initBoard();
            updateBetUI();
            updateBalanceUI();
            drawBoard();
            gameLoop();
        })();
    </script>
</body>
  </html>
